  }
  function up(e) {
    if (!d || e.pointerId !== d.pid) return;
    const dd = d; const was = d.started; const t = d.target;
    end();
    if (was) { suppressClick(); if (t) commit(dd, t); }
  }
  function cancel(e) { if (!d || e.pointerId !== d.pid) return; end(); }
  function end() {
    if (!d) return;
    clearTimeout(d.timer); cancelAnimationFrame(raf);
    if (d.ghost) d.ghost.remove();
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', cancel);
    window.removeEventListener('touchmove', tmove);
    document.body.classList.remove('is-dragging');
    const was = d.started; d = null; lastKey = '';
    if (was) setDv(null);
  }
  function suppressClick() {
    const h = (e) => { e.stopPropagation(); e.preventDefault(); };
    window.addEventListener('click', h, true);
    setTimeout(() => window.removeEventListener('click', h, true), 0);
  }
  function commit(dd, t) {
    const L = getLatest();
    if (dd.type === 'card') {
      const card = Data.cards[dd.id]; if (!card) return;
      const sib = (L.byList.get(t.listId) || []).filter((c) => c.id !== dd.id);
      if (card.listId === t.listId) {
        const curIndex = sib.filter((c) => c.position < card.position).length;
        if (curIndex === t.index) return;
      }
      const pos = positionBetween(sib[t.index - 1]?.position, sib[t.index]?.position);
      const p = { listId: t.listId, position: pos };
      if (card.listId !== t.listId) p.activities = logged(card, `moveu o cartão para “${Data.lists[t.listId]?.title || ''}”`);
      patch('cards', dd.id, p);
    } else {
      const key = t.rowId || '';
      const group = L.groups.get(key) || [];
      const ordered = group.filter((l) => l.id !== dd.id);
      const cur = group.findIndex((l) => l.id === dd.id);
      if (cur >= 0 && cur === t.index) return;
      const pos = positionBetween(ordered[t.index - 1]?.position, ordered[t.index]?.position);
      const p = { position: pos };
      if (L.hasRows) p.rowId = t.rowId;
      patch('lists', dd.id, p);
      if (L.hasRows && cur < 0) {
        const row = (L.rows || []).find((r) => r.id === t.rowId);
        if (row) toast(`Lista movida para a linha “${row.name}”`, 'success');
      }
    }
  }
  return { down, end };
}

/* ---------- Tela do quadro ---------- */
function BoardPage({ id, cardId, go }) {
  useData();
  const board = Data.boards[id];
  const visible = !!board && canSeeBoard(board);
  const [editingTitle, setEditingTitle] = useState(false);
  const [titleDraft, setTitleDraft] = useState('');
  const [term, setTerm] = useState('');
  const [labelFilter, setLabelFilter] = useState([]);
  const [memberFilter, setMemberFilter] = useState([]);
  const [dueFilter, setDueFilter] = useState('all');
  const [unflagOpen, setUnflagOpen] = useState(false);
  const [rowDlg, setRowDlg] = useState(false);
  const [, setTick] = useState(0);
  useEffect(() => { const t = setInterval(() => setTick((x) => x + 1), 60000); return () => clearInterval(t); }, []);
  useEffect(() => {
    const b = Data.boards[id]; if (!b) return;
    // Tarefas com repetição: marcadas só enquanto a execução atual estiver feita (desmarcam sozinhas na próxima data).
    for (const c of cardsOfBoard(id)) {
      if (!c.schedule || !c.schedule.type) continue;
      const want = schedStatus(c).k === 'done';
      if (!!c.isCompleted !== want) patch('cards', c.id, { isCompleted: want });
    }
    // Listas: registra a conclusão (todas as tarefas feitas) e, nas listas com repetição,
    // desmarca as tarefas no dia seguinte para o próximo ciclo.
    const today = todayStr();
    for (const l of listsOf(id)) {
      const custom = !!(l.schedule && l.schedule.type);
      if (!custom && !b.dayTracking) continue;
      const cs = cardsOfList(l.id); if (!cs.length) continue;
      const allDone = cs.every(countsAsDone);
      if (!custom) { if (allDone && (l.lastDoneDate || '') < today) patch('lists', l.id, { lastDoneDate: today }); continue; }
      const st = listStatus(l, b.dayTracking);
      if ((st.k === 'due' || st.k === 'late') && allDone) { patch('lists', l.id, { doneFor: st.last, lastDoneDate: today }); continue; }
      if (l.doneFor && l.lastDoneDate && today > l.lastDoneDate) {
        for (const c of cs) {
          if (c.isTask && !(c.schedule && c.schedule.type) && c.isCompleted && (c.lastDoneDate || '') <= l.lastDoneDate) patch('cards', c.id, { isCompleted: false });
        }
      }
    }
  });
  const [layout, setLayoutState] = useState(() => { const v = LS.get('list-layout:' + id, 'row'); return ['row', 'grid', 'column'].includes(v) ? v : 'row'; });
  const setLayout = (v) => { setLayoutState(v); LS.set('list-layout:' + id, v); };

  useEffect(() => { if (!visible) go({ name: 'home' }); }, [visible]);
  useEffect(() => { if (board) document.title = `${board.title} · Flowtify`; return () => { document.title = 'Flowtify'; }; }, [board?.title]);
  if (!visible) return null;

  const ws = Data.workspaces[board.workspaceId];
  const members = membersOfWs(ws);
  const labels = board.labels || [];
  const lists = orderedLists(board);
  const rows = boardRows(board);
  const allCards = cardsOfBoard(id).filter((c) => Data.lists[c.listId]);
  const completed = allCards.filter((c) => c.isCompleted);
  const lateL = lateLists(lists, !!board.dayTracking);
  const lateTasks = allCards.filter((c) => c.schedule && c.schedule.type).map((c) => ({ c, s: schedStatus(c) })).filter((x) => x.s.k === 'late');
  const t = term.trim().toLowerCase();
  const filtered = allCards.filter((c) => {
    if (t && !c.title.toLowerCase().includes(t)) return false;
    if (labelFilter.length && !labelFilter.some((l) => (c.labelIds || []).includes(l))) return false;
    if (memberFilter.length && !memberFilter.some((m) => (c.memberIds || []).includes(m))) return false;
    if (dueFilter !== 'all') {
      const st = dueState(c.dueDate, c.isCompleted);
      const sk = c.schedule && c.schedule.type ? schedStatus(c).k : null;
      if (dueFilter === 'none' && (st !== 'none' || sk)) return false;
      if (dueFilter === 'overdue' && st !== 'overdue' && sk !== 'late') return false;
      if (dueFilter === 'soon' && st !== 'soon' && sk !== 'due') return false;
    }
    return true;
  });
  const activeFilters = labelFilter.length + memberFilter.length + (dueFilter !== 'all' ? 1 : 0);
  const toggleIn = (arr, set, v) => set(arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);

  function saveTitle() {
    setEditingTitle(false);
    const v = titleDraft.trim();
    if (v && v !== board.title) patch('boards', id, { title: v });
  }
  function unflag() {
    for (const c of completed) uncheckCard(c);
    toast(completed.length === 1 ? '1 tarefa voltou a ficar pendente.' : `${completed.length} tarefas voltaram a ficar pendentes.`, 'success');
  }

  return html`<div className="board" style=${bgStyle(board.background)}>
    <div className="board-bar">
      <div>
        ${editingTitle
          ? html`<input className="inp board-title-inp" autoFocus=${true} value=${titleDraft} aria-label="Nome do quadro"
              onChange=${(e) => setTitleDraft(e.target.value)} onBlur=${saveTitle}
              onKeyDown=${(e) => { if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') setEditingTitle(false); }} />`
          : html`<button className="board-title" title="Editar nome do quadro" onClick=${() => { setTitleDraft(board.title); setEditingTitle(true); }}>
              ${board.title}<${Icon} n="pencil" s=${14} /></button>`}
        <div className="board-ws" style=${{ paddingLeft: 8 }}>${ws?.name}</div>
      </div>
      <div className="board-tools">
        <div className="layout-seg on-bg" role="radiogroup" aria-label="Organização das listas">
          ${[['row', 'columns', 'Lado a lado'], ['grid', 'grid', 'Em grade'], ['column', 'rows', 'Uma embaixo da outra']].map(([k, ic, l]) => html`
            <button key=${k} role="radio" aria-checked=${layout === k} aria-label=${'Listas: ' + l} title=${'Listas: ' + l}
              className=${layout === k ? 'on' : ''} onClick=${() => setLayout(k)}><${Icon} n=${ic} /></button>`)}
        </div>
        <button className=${'btn ' + (board.dayTracking ? 'is-on' : 'btn-secondary')} aria-pressed=${!!board.dayTracking}
          title=${board.dayTracking ? 'Desligar o marcador de dias deste quadro' : 'Mostrar se cada lista está em dia ou atrasada'}
          onClick=${() => { patch('boards', id, { dayTracking: !board.dayTracking }); toast(board.dayTracking ? 'Marcador de dias desligado' : 'Marcador de dias ligado: listas com tudo concluído ficam em dia', 'success'); }}>
          <${Icon} n="calendar" /> Marcador de dias</button>
        <button className="btn btn-secondary" title="Dividir o quadro em linhas com nome" onClick=${() => setRowDlg(true)}>
          <${Icon} n="rows" /> Nova linha</button>
        <input className="inp filter-inp on-bg" value=${term} placeholder="Filtrar cartões…" aria-label="Filtrar cartões por palavra"
          onChange=${(e) => setTerm(e.target.value)} />
        <${Popover} align="end" width=${268} trigger=${({ toggle }) => html`<button className="btn btn-secondary" onClick=${toggle}>
            <${Icon} n="filter" /> Filtros ${activeFilters > 0 && html`<span className="badge">${activeFilters}</span>`}</button>`}>
          <div className="f-sec">
            <p className="f-h">Prazo</p>
            <div className="f-due">
              ${[['all', 'Todos'], ['overdue', 'Atrasados'], ['soon', 'Hoje'], ['none', 'Sem data']].map(([k, l]) => html`
                <button key=${k} className=${'btn btn-xs ' + (dueFilter === k ? 'btn-primary' : 'btn-outline')} onClick=${() => setDueFilter(k)}>${l}</button>`)}
            </div>
          </div>
          <div className="f-sec">
            <p className="f-h">Etiquetas</p>
            ${labels.length === 0 && html`<p className="muted small">Este quadro ainda não tem etiquetas.</p>`}
            ${labels.map((l) => html`<button key=${l.id} className=${'menu-item' + (labelFilter.includes(l.id) ? ' on' : '')}
                onClick=${() => toggleIn(labelFilter, setLabelFilter, l.id)}>
                <span className="swatch" style=${{ ...lblStyle(l.color), width: 24 }}></span><span className="trunc">${l.name || LABEL_NAMES[l.color]}</span>
                ${labelFilter.includes(l.id) && html`<span className="trail"><${Icon} n="check" s=${14} /></span>`}</button>`)}
          </div>
          <div className="f-sec">
            <p className="f-h">Pessoas</p>
            ${members.map((m) => html`<button key=${m.id} className=${'menu-item' + (memberFilter.includes(m.id) ? ' on' : '')}
                onClick=${() => toggleIn(memberFilter, setMemberFilter, m.id)}>
                <${Avatar} person=${m} size=${20} /><span className="trunc">${m.name}${m.id === Me.id ? ' (você)' : ''}</span>
                ${memberFilter.includes(m.id) && html`<span className="trail"><${Icon} n="check" s=${14} /></span>`}</button>`)}
          </div>
          ${(activeFilters > 0 || term) && html`<button className="btn btn-ghost btn-sm" style=${{ width: '100%' }}
              onClick=${() => { setLabelFilter([]); setMemberFilter([]); setDueFilter('all'); setTerm(''); }}><${Icon} n="x" s=${14} /> Limpar filtros</button>`}
        <//>
        <button className="btn btn-secondary" title="Desmarcar todas as tarefas concluídas" disabled=${completed.length === 0}
          onClick=${() => setUnflagOpen(true)}><${Icon} n="listRestart" /> Desmarcar concluídas</button>
      </div>
    </div>

    ${(board.dayTracking || lateTasks.length > 0 || lateL.length > 0) && html`<${DayAlert} lists=${lists} tracking=${!!board.dayTracking} tasks=${lateTasks} />`}
    <div className="board-area">
      <${Canvas} key=${id} layout=${layout} board=${board} lists=${lists} cards=${filtered} members=${members} labels=${labels}
        openCard=${(cid) => go({ name: 'board', id, card: cid })} />
      <${StickyNotes} boardId=${id} />
    </div>

    ${cardId && Data.cards[cardId] && Data.cards[cardId].boardId === id && html`<${CardModal} key=${cardId} cardId=${cardId} board=${board}
        lists=${lists} members=${members} labels=${labels} onClose=${() => go({ name: 'board', id })} />`}

    <${NameDialog} open=${rowDlg} onClose=${() => setRowDlg(false)} title="Nova linha" placeholder="Ex.: Bancos" cta="Criar linha"
      sub=${rows.length ? 'Depois, arraste listas para ela pela alça ou crie listas dentro dela.' : 'As listas atuais entram nesta linha. Depois, crie outras linhas e arraste as listas entre elas.'}
      onSave=${(n) => { addRow(board, n); toast(`Linha “${n}” criada`, 'success'); setTimeout(() => { const c = document.querySelector('.canvas'); if (c) c.scrollTo({ top: c.scrollHeight, behavior: 'smooth' }); }, 60); }} />
    <${ConfirmDialog} open=${unflagOpen} onClose=${() => setUnflagOpen(false)} title="Desmarcar tarefas concluídas?"
      body=${(completed.length === 1 ? '1 tarefa concluída será desmarcada e voltará a aparecer como pendente.'
        : `${completed.length} tarefas concluídas serão desmarcadas e voltarão a aparecer como pendentes.`)
        + (completed.some((c) => c.schedule && c.schedule.type) ? ' Nas tarefas com repetição, a conclusão da data atual também é desfeita.' : '')
        + ' Nenhum cartão será excluído.'}
      confirmLabel="Desmarcar" onConfirm=${unflag} />
  </div>`;
}

function Canvas({ layout = 'row', board, lists, cards, members, labels, openCard }) {
  const canvasRef = useRef(null);
  const [widths, setWidths] = useState(() => LS.get('list-widths:' + board.id, {}) || {});
  const [collapsed, setCollapsed] = useState(() => LS.get('rows-collapsed:' + board.id, []) || []);
  const [dv, setDv] = useState(null);
  const [delRow, setDelRow] = useState(null);
  const base = useRef({});
  const rows = boardRows(board);
  const hasRows = rows.length > 0;
  const byList = useMemo(() => {
    const m = new Map(lists.map((l) => [l.id, []]));
    for (const c of cards) { const a = m.get(c.listId); if (a) a.push(c); }
    for (const a of m.values()) a.sort(byPos);
    return m;
  }, [lists, cards]);
  const groups = new Map();
  if (hasRows) { for (const r of rows) groups.set(r.id, []); for (const l of lists) groups.get(effRowId(l, rows))?.push(l); }
  else groups.set('', lists);
  const latest = useRef(null); latest.current = { byList, lists, layout, groups, hasRows, rows };
  const dnd = useRef(null);
  if (!dnd.current) dnd.current = createDnd({ getLatest: () => latest.current, setDv, canvasRef });
  useEffect(() => () => dnd.current.end(), []);
  const lastPosition = Math.max(0, ...lists.map((l) => l.position || 0));

  function onResize(listId, dx, phase) {
    if (phase === 'start') { base.current[listId] = widths[listId] ?? DEFAULT_LIST_W; return; }
    if (phase === 'cancel') return;
    const w = Math.round(Math.min(640, Math.max(200, (base.current[listId] ?? DEFAULT_LIST_W) + dx)));
    setWidths((prev) => {
      const n = { ...prev, [listId]: w };
      if (phase === 'end') LS.set('list-widths:' + board.id, n);
      return n;
    });
  }
  useEffect(() => {
    const h = (e) => {
      const det = typeof e.detail === 'string' ? { listId: e.detail } : (e.detail || {});
      const lid = det.listId; const l = Data.lists[lid]; if (!l) return;
      const rid = hasRows ? effRowId(l, rows) : null;
      if (rid && collapsed.includes(rid)) setCollapsed((prev) => { const n = prev.filter((x) => x !== rid); LS.set('rows-collapsed:' + board.id, n); return n; });
      setTimeout(() => {
        const c = canvasRef.current; if (!c) return;
        const el = (det.cardId && c.querySelector(`[data-card-id="${det.cardId}"]`)) || c.querySelector(`[data-list-id="${lid}"]`);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 1500);
      }, 80);
    };
    window.addEventListener('flowtify:focus-list', h);
    return () => window.removeEventListener('flowtify:focus-list', h);
  });
  function toggleCollapse(rowId) {
    setCollapsed((prev) => { const n = prev.includes(rowId) ? prev.filter((x) => x !== rowId) : [...prev, rowId]; LS.set('rows-collapsed:' + board.id, n); return n; });
  }

  const draggingList = dv && dv.type === 'list' ? dv.id : null;
  function renderLists(key, groupLists) {
    const shown = groupLists.filter((l) => l.id !== draggingList);
    const here = draggingList && dv.target && (dv.target.rowId || '') === key;
    const listPh = here && html`<div key="__list_ph" className="list-ph" style=${{ width: dv.w, height: Math.min(dv.h, 360) }}></div>`;
    const cols = [];
    shown.forEach((l, i) => {
      if (here && dv.target.index === i) cols.push(listPh);
      cols.push(html`<${ListColumn} key=${l.id} list=${l} cards=${byList.get(l.id) || []} allLists=${lists} members=${members}
        labels=${labels} width=${widths[l.id] ?? DEFAULT_LIST_W} onResize=${(dx, phase) => onResize(l.id, dx, phase)}
        dnd=${dnd.current} dv=${dv} openCard=${openCard} tracking=${!!board.dayTracking} />`);
    });
    if (here && dv.target.index === shown.length) cols.push(listPh);
    cols.push(html`<${AddList} key="__add" boardId=${board.id} rowId=${key || null} lastPosition=${lastPosition} />`);
    return cols;
  }

  if (!hasRows) {
    return html`<div className=${'canvas lay-' + layout} ref=${canvasRef} data-row-drop="">${renderLists('', lists)}</div>`;
  }
  return html`<div className="canvas has-rows" ref=${canvasRef}>
    ${rows.map((r, i) => {
      const isCol = collapsed.includes(r.id);
      const n = (groups.get(r.id) || []).length;
      return html`<section key=${r.id} className=${'row-sec' + (isCol ? ' collapsed' : '')} aria-label=${'Linha ' + r.name}>
        <${RowHeader} row=${r} count=${n} late=${lateLists(groups.get(r.id) || [], !!board.dayTracking).length} collapsed=${isCol} first=${i === 0} last=${i === rows.length - 1}
          onToggle=${() => toggleCollapse(r.id)} onRename=${(name) => renameRow(board, r.id, name)}
          onMove=${(d) => moveRow(board, r.id, d)} onDelete=${() => (n ? setDelRow(r) : deleteRow(board, r.id))} />
        ${!isCol && html`<div className=${'row-lists lay-' + layout} data-row-drop=${r.id}>${renderLists(r.id, groups.get(r.id) || [])}</div>`}
      </section>`;
    })}
    <${AddRowButton} board=${board} />
    ${delRow && html`<${ConfirmDialog} open=${true} onClose=${() => setDelRow(null)} danger=${true} confirmLabel="Excluir linha"
      title=${`Excluir a linha “${delRow.name}”?`}
      body=${(() => { const i = rows.findIndex((x) => x.id === delRow.id); const t = rows[i - 1] || rows[i + 1];
        const n = (groups.get(delRow.id) || []).length;
        return t ? `${plural(n, 'lista vai', 'listas vão')} para a linha “${t.name}”. Nenhum cartão será excluído.`
          : `${plural(n, 'lista volta', 'listas voltam')} a ficar sem linha. Nenhum cartão será excluído.`; })()}
      onConfirm=${() => { const t = deleteRow(board, delRow.id); toast(t ? `Linha excluída; listas movidas para “${t.name}”` : 'Linha excluída', 'success'); }} />`}
  </div>`;
}

function RowHeader({ row, count, late = 0, collapsed, first, last, onToggle, onRename, onMove, onDelete }) {
  const [name, setName] = useState(row.name);
  useEffect(() => setName(row.name), [row.name]);
  const commit = () => { const v = name.trim(); if (!v) { setName(row.name); return; } if (v !== row.name) onRename(v); };
  return html`<div className="row-head">
    <button className="btn btn-icon btn-xs row-btn" aria-expanded=${!collapsed} aria-label=${collapsed ? 'Mostrar linha' : 'Recolher linha'}
      title=${collapsed ? 'Mostrar linha' : 'Recolher linha'} onClick=${onToggle}><${Icon} n=${collapsed ? 'chevronRight' : 'chevronDown'} s=${15} /></button>
    <input className="row-name" value=${name} aria-label="Nome da linha" onChange=${(e) => setName(e.target.value)} onBlur=${commit}
      onKeyDown=${(e) => { if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') { setName(row.name); setTimeout(() => e.target.blur()); } }} />
    <span className="row-meta">${plural(count, 'lista', 'listas')}${late > 0 && html`<span className="row-late">${late} em atraso</span>`}</span>
    <button className="btn btn-icon btn-xs row-btn" aria-label="Subir linha" title="Subir linha" disabled=${first} onClick=${() => onMove(-1)}><${Icon} n="arrowUp" s=${14} /></button>
    <button className="btn btn-icon btn-xs row-btn" aria-label="Descer linha" title="Descer linha" disabled=${last} onClick=${() => onMove(1)}><${Icon} n="arrowDown" s=${14} /></button>
    <button className="btn btn-icon btn-xs row-btn" aria-label="Excluir linha" title="Excluir linha" onClick=${onDelete}><${Icon} n="trash" s=${14} /></button>
  </div>`;
}

function AddRowButton({ board }) {
  const [open, setOpen] = useState(false);
  return html`<${Fragment}>
    <button className="add-row-btn" onClick=${() => setOpen(true)}><${Icon} n="plus" /> Adicionar linha</button>
    <${NameDialog} open=${open} onClose=${() => setOpen(false)} title="Nova linha" placeholder="Ex.: Financeiras" cta="Criar linha"
      sub="Depois, arraste listas para ela pela alça ou crie listas dentro dela."
      onSave=${(n) => { addRow(board, n); toast(`Linha “${n}” criada`, 'success'); setTimeout(() => { const c = document.querySelector('.canvas'); if (c) c.scrollTo({ top: c.scrollHeight, behavior: 'smooth' }); }, 60); }} />
  <//>`;
}

function DayAlert({ lists, tracking, tasks = [] }) {
  const tracked = tracking ? lists.filter((l) => cardsOfList(l.id).length > 0) : [];
  const late = lateLists(lists, tracking).sort((a, b) => a.s.since.localeCompare(b.s.since));
  const lt = [...tasks].sort((a, b) => a.s.since.localeCompare(b.s.since));
  const focus = (detail) => window.dispatchEvent(new CustomEvent('flowtify:focus-list', { detail }));
  if (!late.length && !lt.length) {
    if (!tracked.length) return null;
    const pending = tracked.filter((l) => { const s = listStatus(l, true); return s && s.k === 'due'; }).length;
    return html`<div className="day-alert ok" role="status"><${Icon} n="check" s=${15} className="ic-ok" />
      <strong>Nenhuma lista em atraso.</strong>
      <span className="muted">${pending ? `${plural(pending, 'lista pendente', 'listas pendentes')} hoje.` : 'Todas concluídas hoje.'}</span></div>`;
  }
  return html`<div className="day-alert" role="alert">
    <${Icon} n="calendar" s=${15} className="ic-late" />
    ${late.length > 0 && html`<${Fragment}>
      <strong>${late.length === 1 ? '1 lista em atraso:' : `${late.length} listas em atraso:`}</strong>
      ${late.map(({ l, s }) => html`<button key=${l.id} className="late-chip" title=${'Ir para ' + l.title + (s.custom ? `; ${schedLabel(s.sch)}` : '')}
          onClick=${() => focus(l.id)}>${l.title} (${s.custom ? `desde ${fmtWd(s.since)}` : daysTxt(s.missed)})</button>`)}
      ${lt.length > 0 && html`<span style=${{ width: 8 }}></span>`}
    <//>`}
    ${lt.length > 0 && html`<${Fragment}>
      <strong>${lt.length === 1 ? '1 tarefa atrasada:' : `${lt.length} tarefas atrasadas:`}</strong>
      ${lt.map(({ c, s }) => html`<button key=${c.id} className="late-chip" title=${`${schedLabel(c.schedule)}; atrasada desde ${fmtWd(s.since)}`}
          onClick=${() => focus({ listId: c.listId, cardId: c.id })}>${c.title} em ${Data.lists[c.listId]?.title || ''} (desde ${fmtWd(s.since)})</button>`)}
    <//>`}
  </div>`;
}

function DayMarker({ list, tracking, onOpen }) {
  const st = listStatus(list, tracking); if (!st) return null;
  const today = todayStr();
  let cls; let label; let side; let sideTitle;
  if (st.custom) {
    cls = { due: 'today', late: 'late', done: 'ok', upcoming: 'next' }[st.k];
    label = st.k === 'due' ? 'Vence hoje' : st.k === 'late' ? `Atrasada desde ${fmtWd(st.since)}` : st.k === 'done' ? 'Em dia' : `Próxima: ${fmtWd(st.next)}`;
    side = schedLabel(st.sch); sideTitle = 'Repetição da lista: ' + side;
  } else {
    cls = st.k === 'late' ? 'late' : st.k === 'due' ? 'today' : 'ok';
    label = st.k === 'late' ? `Atrasada há ${daysTxt(st.missed)}` : st.k === 'due' ? 'Pendente hoje' : 'Em dia';
    side = !list.lastDoneDate ? 'sem registro' : list.lastDoneDate >= today ? 'concluída hoje'
      : `última: ${parseDay(list.lastDoneDate).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}`;
    sideTitle = list.lastDoneDate ? 'Última conclusão em ' + fmtDayLong(list.lastDoneDate) : 'Ainda sem conclusão registrada';
  }
  return html`<div className="day-line">
    <button className=${'day-pill day-' + cls} title="Prazo e repetição da lista" onClick=${onOpen}>
      ${cls === 'ok' && html`<${Icon} n="check" s=${12} />`}${label}</button>
    <span className="day-when" title=${sideTitle}>${side}</span>
  </div>`;
}

function ListScheduleDialog({ list, tracking, open, onClose }) {
  const [date, setDate] = useState(list.lastDoneDate || '');
  useEffect(() => { if (open) setDate(list.lastDoneDate || ''); }, [open]);
  if (!open) return null;
  const custom = !!(list.schedule && list.schedule.type);
  const st = listStatus(list, tracking);
  const today = todayStr();
  const setSched = (next) => patch('lists', list.id, { schedule: next, doneFor: null });
  const saveDate = (v) => { patch('lists', list.id, { lastDoneDate: v || null }); onClose(); };
  const statusTxt = !st || !custom ? '' : st.k === 'due' ? 'Precisa estar concluída hoje.'
    : st.k === 'late' ? `Atrasada desde ${fmtWd(st.since)}${st.missed > 1 ? ` (${st.missed} execuções perdidas)` : ''}.`
    : st.k === 'done' ? `Feita hoje. Próxima: ${fmtWd(st.next)}.`
    : `Próxima execução: ${fmtWd(st.next)}.`;
  return html`<${Dialog} open=${true} onClose=${onClose} width=${480} label="Prazo da lista">
    <h2>Prazo da lista: ${list.title}</h2>
    <p className="sub">${custom
      ? 'A execução conta como feita quando todas as tarefas da lista estão concluídas, no dia ou antes. No dia seguinte, elas se desmarcam sozinhas para o próximo ciclo.'
      : tracking ? 'Sem repetição própria, a lista segue o marcador de dias: precisa ficar com tudo concluído todo dia útil.'
      : 'Escolha em que dias a lista precisa estar concluída. Se a data passar, ela fica atrasada e aparece no aviso do quadro.'}</p>
    <div className="dlg-body">
      <${ScheduleFields} sch=${custom ? list.schedule : null} onSet=${setSched}
        noneLabel=${tracking ? 'Seguir o marcador de dias (todo dia útil)' : 'Não se repete'} />
      ${custom && st && html`<p className=${'sched-status ' + st.k}>${schedLabel(list.schedule)}. ${statusTxt}</p>`}
      ${custom && st && (st.k === 'due' || st.k === 'late') && html`<div>
        <button className="btn btn-secondary btn-sm" onClick=${() => { patch('lists', list.id, { doneFor: st.last, lastDoneDate: today }); onClose(); }}>
          <${Icon} n="check" s=${14} /> Marcar execução como feita</button></div>`}
      ${!custom && tracking && html`<${Fragment}>
        <label className="field">Última conclusão
          <input type="date" className="inp" value=${date} max=${today} onChange=${(e) => setDate(e.target.value)} /></label>
        <div className="row" style=${{ flexWrap: 'wrap' }}>
          <button className="btn btn-secondary btn-sm" onClick=${() => saveDate(today)}>Concluída hoje</button>
          <button className="btn btn-secondary btn-sm" onClick=${() => saveDate(date)} disabled=${!date || date === (list.lastDoneDate || '')}>Salvar data</button>
          <button className="btn btn-ghost btn-sm" onClick=${() => saveDate(null)}>Limpar data</button>
        </div>
      <//>`}
    </div>
    <div className="dlg-foot"><button className="btn btn-primary" onClick=${onClose}>Fechar</button></div>
  <//>`;
}

function ListColumn({ list, cards, allLists, members, labels, width, onResize, dnd, dv, openCard, tracking }) {
  const [schedOpen, setSchedOpen] = useState(false);
  const listCustom = !!(list.schedule && list.schedule.type);
  const [title, setTitle] = useState(list.title);
  const [adding, setAdding] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  useEffect(() => setTitle(list.title), [list.title]);

  const draggingCard = dv && dv.type === 'card' ? dv.id : null;
  const visible = cards.filter((c) => c.id !== draggingCard);
  const showPh = draggingCard && dv.target && dv.target.listId === list.id;
  const ph = showPh && html`<div key="__card_ph" className="card-ph" style=${{ height: Math.min(dv.h, 160) }}></div>`;
  const items = [];
  visible.forEach((c, i) => {
    if (showPh && dv.target.index === i) items.push(ph);
    items.push(html`<${CardTile} key=${c.id} card=${c} labels=${labels} dnd=${dnd} onOpen=${() => openCard(c.id)} />`);
  });
  if (showPh && dv.target.index === visible.length) items.push(ph);

  const totalInList = cardsOfList(list.id).length;
  const doneTasks = cards.filter((c) => c.isTask && c.isCompleted);

  function rename() {
    const v = title.trim();
    if (!v) { setTitle(list.title); return; }
    if (v !== list.title) patch('lists', list.id, { title: v });
  }

  return html`<section className="list" data-list-id=${list.id} data-list-drop=${list.id} style=${{ width }} aria-label=${'Lista ' + list.title}>
    <div className="list-head">
      <button className="grip" aria-label="Mover lista" title="Arraste para mover a lista" onPointerDown=${(e) => dnd.down(e, 'list', list.id)}>
        <${Icon} n="grip" /></button>
      <input className="list-title" value=${title} aria-label="Nome da lista" onChange=${(e) => setTitle(e.target.value)} onBlur=${rename}
        onKeyDown=${(e) => { if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') { setTitle(list.title); setTimeout(() => e.target.blur()); } }} />
      <span className="list-count">${cards.length}</span>
      ${doneTasks.length > 0 && html`<button className="btn btn-ghost btn-icon btn-xs" title="Limpar tarefas concluídas" aria-label="Limpar tarefas concluídas"
          onClick=${() => doneTasks.forEach(uncheckCard)}><${Icon} n="rotate" s=${14} /></button>`}
      <button className=${'btn btn-icon btn-xs ' + (listCustom ? 'is-on' : 'btn-ghost')} title=${listCustom ? 'Repetição: ' + schedLabel(list.schedule) : 'Prazo e repetição da lista'}
        aria-label="Prazo e repetição da lista" onClick=${() => setSchedOpen(true)}><${Icon} n="repeat" s=${13} /></button>
      <button className="btn btn-ghost btn-icon btn-xs" title="Duplicar lista" aria-label="Duplicar lista" onClick=${() => duplicateList(list)}>
        <${Icon} n="copy" s=${14} /></button>
      <button className="btn btn-ghost btn-icon btn-xs" title="Excluir lista" aria-label="Excluir lista"
        onClick=${() => (totalInList ? setConfirmDel(true) : deleteList(list))}><${Icon} n="trash" s=${14} /></button>
    </div>
    ${(tracking || listCustom) && totalInList > 0 && html`<${DayMarker} list=${list} tracking=${tracking} onOpen=${() => setSchedOpen(true)} />`}
    <${ListScheduleDialog} list=${list} tracking=${tracking} open=${schedOpen} onClose=${() => setSchedOpen(false)} />
    <div className="list-cards">${items}</div>
    ${adding
      ? html`<${AddCardForm} list=${list} allLists=${allLists} members=${members} onClose=${() => setAdding(false)} />`
      : html`<button className="add-card-btn" onClick=${() => setAdding(true)}><${Icon} n="plus" /> Adicionar cartão ou tarefa</button>`}
    <${ResizeHandle} label="Redimensionar lista" onDrag=${(dx, _dy, phase) => onResize(dx, phase)} />
    <${ConfirmDialog} open=${confirmDel} onClose=${() => setConfirmDel(false)} danger=${true} confirmLabel="Excluir lista"
      title=${`Excluir a lista “${list.title}”?`} body=${`${plural(totalInList, 'cartão será excluído', 'cartões serão excluídos')} junto com ela. Isso não pode ser desfeito.`}
      onConfirm=${() => deleteList(list)} />
  </section>`;
}

function CardTile({ card, labels, dnd, onOpen }) {
  const down = (e) => dnd.down(e, 'card', card.id);
  if (card.isTask) {
    const st = card.schedule && card.schedule.type ? schedStatus(card) : null;
    return html`<div className="ctile ttile" data-card-id=${card.id} onPointerDown=${down}>
      <input type="checkbox" checked=${!!card.isCompleted} aria-label="Concluir tarefa"
        onChange=${(e) => checkTask(card, e.target.checked)} />
      <div className="t-body">
        <span className=${'ctile-title' + (card.isCompleted ? ' done' : '')} onClick=${onOpen} title="Abrir a tarefa para editar ou definir repetição">${card.title}</span>
        ${st && html`<span className=${'sched sched-' + st.k}><${Icon} n="repeat" s=${10} />${schedLabel(card.schedule)}, ${schedText(st)}</span>`}
      </div>
      <button className="tdel" aria-label="Excluir tarefa" title="Excluir tarefa" onClick=${() => remove('cards', card.id)}><${Icon} n="trash" s=${14} /></button>
    </div>`;
  }
  const cl = labels.filter((l) => (card.labelIds || []).includes(l.id));
  const cm = (card.memberIds || []).map((pid) => Data.people[pid]).filter(Boolean);
  const due = dueState(card.dueDate, card.isCompleted);
  const items = (card.checklists || []).flatMap((c) => c.items || []);
  const done = items.filter((i) => i.checked).length;
  const steps = card.pipelineListIds || [];
  const stepIdx = steps.indexOf(card.listId);
  const nComments = (card.comments || []).length;
  const nAtt = (card.attachments || []).length;
  const hasMeta = due !== 'none' || items.length || nComments || nAtt || cm.length || (steps.length > 1 && stepIdx >= 0) || card.description;
  return html`<div className="ctile" data-card-id=${card.id} role="button" tabIndex="0" onPointerDown=${down} onClick=${onOpen}
      onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpen(); } }}>
    ${cl.length > 0 && html`<div className="ctile-labels">${cl.map((l) => html`<span key=${l.id} className="lbl-bar" style=${lblStyle(l.color)} title=${l.name}></span>`)}</div>`}
    <p className=${'ctile-title' + (card.isCompleted ? ' done' : '')}>${card.title}</p>
    ${hasMeta && html`<div className="ctile-meta">
      ${due !== 'none' && html`<span className=${'due due-' + due} title=${'Prazo: ' + fmtDayLong(card.dueDate)}><${Icon} n="calendar" s=${11} />${fmtDay(card.dueDate)}</span>`}
      ${card.description && html`<span className="meta" title="Tem descrição"><${Icon} n="text" s=${11} /></span>`}
      ${items.length > 0 && html`<span className=${'meta' + (done === items.length ? ' full' : '')} title="Checklist"><${Icon} n="checkSquare" s=${11} />${done}/${items.length}</span>`}
      ${nComments > 0 && html`<span className="meta" title="Comentários"><${Icon} n="message" s=${11} />${nComments}</span>`}
      ${nAtt > 0 && html`<span className="meta" title="Anexos"><${Icon} n="clip" s=${11} />${nAtt}</span>`}
      ${steps.length > 1 && stepIdx >= 0 && html`<span className="meta" title=${`Esteira: etapa ${stepIdx + 1} de ${steps.length}`}><${Icon} n="moveRight" s=${11} />${stepIdx + 1}/${steps.length}</span>`}
      ${cm.length > 0 && html`<span className="av-stack">${cm.slice(0, 3).map((m) => html`<${Avatar} key=${m.id} person=${m} size=${18} />`)}</span>`}
    </div>`}
  </div>`;
}

function AddCardForm({ list, allLists, members, onClose }) {
  const [mode, setMode] = useState('card');
  const [title, setTitle] = useState('');
  const [pipe, setPipe] = useState([]);
  const [auto, setAuto] = useState(true);
  const [owners, setOwners] = useState([]);
  const ref = useRef(null);
  function add() {
    const v = title.trim(); if (!v) return;
    const isCard = mode === 'card';
    const steps = isCard && pipe.length ? (pipe.includes(list.id) ? pipe : [list.id, ...pipe]) : [];
    const firstOwner = isCard ? owners.find((o) => o.listId === list.id)?.personId : null;
    put('cards', uid(), {
      ...cardDefaults(), boardId: list.boardId, listId: list.id, title: v, position: lastPos(list.id) + 1000,
      isTask: !isCard, pipelineListIds: steps, pipelineAuto: auto, pipelineOwners: isCard ? owners : [],
      memberIds: firstOwner ? [firstOwner] : [], createdAt: now(), createdBy: Me.id,
      activities: [{ id: uid(), personId: Me.id, action: isCard ? 'criou o cartão' : 'criou a tarefa', at: now() }],
    });
    setTitle(''); setPipe([]); setOwners([]);
    if (ref.current) ref.current.focus();
  }
  return html`<div className="add-form">
    <div className="seg" role="group" aria-label="Tipo">
      ${['card', 'task'].map((m) => html`<button key=${m} className=${mode === m ? 'on' : ''} aria-pressed=${mode === m} onClick=${() => setMode(m)}>${m === 'card' ? 'Cartão' : 'Tarefa'}</button>`)}
    </div>
    <textarea ref=${ref} className="inp inp-sm" rows="2" autoFocus=${true} value=${title}
      placeholder=${mode === 'card' ? 'Título do cartão' : 'Descrição da tarefa'} aria-label=${mode === 'card' ? 'Título do cartão' : 'Descrição da tarefa'}
      onChange=${(e) => setTitle(e.target.value)}
      onKeyDown=${(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); add(); } if (e.key === 'Escape') onClose(); }}></textarea>
    ${mode === 'card' && allLists.length > 1 && html`<${PipelineEditor} lists=${allLists} value=${pipe} auto=${auto} onChange=${setPipe}
        onAutoChange=${setAuto} members=${members} owners=${owners} onOwnersChange=${setOwners} />`}
    ${mode === 'card' && pipe.length > 0 && !pipe.includes(list.id) && html`<p className="hint">“${list.title}” entra como primeira etapa.</p>`}
    <div className="row">
      <button className="btn btn-primary btn-sm" onClick=${add}>Adicionar</button>
      <button className="btn btn-ghost btn-icon btn-sm" aria-label="Cancelar" onClick=${onClose}><${Icon} n="x" /></button>
    </div>
  </div>`;
}
