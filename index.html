<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flowtify</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  --radius: 10px;
  --background: oklch(0.972 0.006 220);
  --foreground: oklch(0.22 0.03 235);
  --surface: oklch(0.95 0.01 220);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.22 0.03 235);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.22 0.03 235);
  --primary: oklch(0.52 0.104 200);
  --primary-foreground: oklch(0.985 0.01 200);
  --secondary: oklch(0.93 0.015 220);
  --secondary-foreground: oklch(0.3 0.03 235);
  --muted: oklch(0.94 0.008 220);
  --muted-foreground: oklch(0.52 0.02 235);
  --accent: oklch(0.79 0.145 72);
  --destructive: oklch(0.585 0.21 22);
  --destructive-foreground: oklch(0.985 0.005 250);
  --success: oklch(0.55 0.14 155);
  --warning: oklch(0.79 0.145 72);
  --warn-text: oklch(0.45 0.11 65);
  --border: oklch(0.88 0.012 220);
  --input: oklch(0.86 0.012 220);
  --ring: oklch(0.52 0.104 200);
  --overlay: oklch(0.15 0.02 240 / 0.55);
  --shadow-tile: 0 1px 2px oklch(0.2 0.03 220 / 0.12), 0 1px 1px oklch(0.2 0.03 220 / 0.06);
  --shadow-lift: 0 12px 28px oklch(0.2 0.03 220 / 0.22);
  --bg-aurora: linear-gradient(135deg, oklch(0.5 0.1 200), oklch(0.42 0.13 250));
  --bg-citrus: linear-gradient(135deg, oklch(0.72 0.14 60), oklch(0.6 0.16 30));
  --bg-forest: linear-gradient(135deg, oklch(0.52 0.12 155), oklch(0.4 0.09 190));
  --bg-dusk: linear-gradient(135deg, oklch(0.45 0.13 300), oklch(0.35 0.1 260));
  --bg-slate: linear-gradient(135deg, oklch(0.42 0.03 240), oklch(0.3 0.03 245));
  --bg-rose: linear-gradient(135deg, oklch(0.62 0.16 10), oklch(0.5 0.13 340));
  --label-green: oklch(0.66 0.15 150);
  --label-yellow: oklch(0.82 0.15 90);
  --label-orange: oklch(0.72 0.16 55);
  --label-red: oklch(0.62 0.2 22);
  --label-purple: oklch(0.58 0.16 300);
  --label-blue: oklch(0.6 0.14 240);
  --label-sky: oklch(0.72 0.11 220);
  --label-lime: oklch(0.78 0.16 130);
  --label-pink: oklch(0.68 0.16 350);
  --label-gray: oklch(0.58 0.02 240);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(0.19 0.024 245);
    --foreground: oklch(0.95 0.008 220);
    --surface: oklch(0.24 0.026 245);
    --card: oklch(0.275 0.026 245);
    --card-foreground: oklch(0.95 0.008 220);
    --popover: oklch(0.235 0.026 245);
    --popover-foreground: oklch(0.95 0.008 220);
    --primary: oklch(0.72 0.11 195);
    --primary-foreground: oklch(0.18 0.03 220);
    --secondary: oklch(0.3 0.028 245);
    --secondary-foreground: oklch(0.94 0.008 220);
    --muted: oklch(0.3 0.024 245);
    --muted-foreground: oklch(0.72 0.02 230);
    --destructive: oklch(0.68 0.19 22);
    --success: oklch(0.72 0.13 158);
    --warning: oklch(0.8 0.14 74);
    --warn-text: oklch(0.85 0.13 80);
    --border: oklch(1 0 0 / 12%);
    --input: oklch(1 0 0 / 18%);
    --ring: oklch(0.72 0.11 195);
    --overlay: oklch(0.05 0.01 240 / 0.65);
    --shadow-tile: 0 1px 2px oklch(0 0 0 / 0.35);
    --shadow-lift: 0 12px 28px oklch(0 0 0 / 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: oklch(0.19 0.024 245);
  --foreground: oklch(0.95 0.008 220);
  --surface: oklch(0.24 0.026 245);
  --card: oklch(0.275 0.026 245);
  --card-foreground: oklch(0.95 0.008 220);
  --popover: oklch(0.235 0.026 245);
  --popover-foreground: oklch(0.95 0.008 220);
  --primary: oklch(0.72 0.11 195);
  --primary-foreground: oklch(0.18 0.03 220);
  --secondary: oklch(0.3 0.028 245);
  --secondary-foreground: oklch(0.94 0.008 220);
  --muted: oklch(0.3 0.024 245);
  --muted-foreground: oklch(0.72 0.02 230);
  --destructive: oklch(0.68 0.19 22);
  --success: oklch(0.72 0.13 158);
  --warning: oklch(0.8 0.14 74);
  --warn-text: oklch(0.85 0.13 80);
  --border: oklch(1 0 0 / 12%);
  --input: oklch(1 0 0 / 18%);
  --ring: oklch(0.72 0.11 195);
  --overlay: oklch(0.05 0.01 240 / 0.65);
  --shadow-tile: 0 1px 2px oklch(0 0 0 / 0.35);
  --shadow-lift: 0 12px 28px oklch(0 0 0 / 0.45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--card); }
body {
  height: 100%; margin: 0;
  font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px; line-height: 1.45;
  color: var(--foreground); background: var(--background);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, .display { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; margin: 0; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
#root { height: 100%; }
.ic { flex-shrink: 0; display: block; }
.muted { color: var(--muted-foreground); }
.small { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* App shell */
.app { height: 100%; display: flex; flex-direction: column; background: var(--background); }
.hdr {
  flex-shrink: 0; height: 56px; display: flex; align-items: center; gap: 8px;
  padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--card);
  position: relative; z-index: 40;
}
.brand {
  font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.03em;
  background: none; border: 0; cursor: pointer; padding: 0 6px 0 0; color: var(--foreground);
}
.brand span, .dot-accent { color: var(--primary); }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.search-trigger { width: 260px; justify-content: flex-start; color: var(--muted-foreground); margin-left: 4px; }
.search-trigger kbd { margin-left: auto; font: 11px "DM Sans", sans-serif; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.main { flex: 1; min-height: 0; overflow: auto; }
.main-board { display: flex; flex-direction: column; overflow: hidden; }
.banner {
  flex-shrink: 0; font-size: 12px; padding: 6px 16px; text-align: center;
  background: color-mix(in srgb, var(--warning) 22%, var(--card)); color: var(--foreground);
  border-bottom: 1px solid var(--border);
}
.is-active { background: var(--muted); }

/* Botões e campos */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color .15s, color .15s, box-shadow .15s, opacity .15s; text-decoration: none;
}
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .inp:focus-visible, .tile:focus-visible, .ctile:focus-visible, .menu-item:focus-visible,
.who-btn:focus-visible, .mc-item:focus-visible, .res:focus-visible, .grip:focus-visible, .ws-btn:focus-visible {
  outline: 2px solid var(--ring); outline-offset: 2px;
}
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 86%, var(--foreground)); }
.btn-secondary { background: var(--secondary); color: var(--secondary-foreground); }
.btn-secondary:hover:not(:disabled) { background: color-mix(in srgb, var(--secondary) 84%, var(--foreground)); }
.btn-outline { border-color: var(--border); background: var(--background); }
.btn-outline:hover:not(:disabled) { background: var(--muted); }
.btn-ghost:hover:not(:disabled) { background: var(--muted); }
.btn-destructive { background: var(--destructive); color: var(--destructive-foreground); }
.btn-destructive:hover:not(:disabled) { background: color-mix(in srgb, var(--destructive) 86%, black); }
.btn-danger { color: var(--destructive); }
.btn-icon { width: 32px; padding: 0; }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn-xs { height: 24px; padding: 0 6px; font-size: 12px; border-radius: 6px; }
.btn-icon.btn-xs { width: 24px; padding: 0; }
.btn-block { width: 100%; justify-content: flex-start; }
.badge { background: var(--primary); color: var(--primary-foreground); border-radius: 999px; padding: 0 6px; font-size: 11px; line-height: 18px; }

.inp {
  width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--input); border-radius: 8px;
  background: var(--background); font-size: 14px; outline: none;
}
.inp:focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
textarea.inp { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.45; }
select.inp { padding: 0 8px; cursor: pointer; }
.inp-sm { height: 30px; font-size: 12.5px; }
textarea.inp-sm { padding: 6px 8px; }
.inp::placeholder { color: var(--muted-foreground); }
input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; margin: 0; cursor: pointer; flex-shrink: 0; }
input[type="checkbox"].switch {
  appearance: none; -webkit-appearance: none; width: 32px; height: 18px; border-radius: 999px;
  background: var(--input); position: relative; transition: background .15s;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .25); transition: transform .15s;
}
input[type="checkbox"].switch:checked { background: var(--primary); }
.switch:checked::after { transform: translateX(14px); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 500; }

/* Diálogos, popovers e menus */
.overlay {
  position: fixed; inset: 0; z-index: 100; background: var(--overlay);
  display: flex; align-items: flex-start; justify-content: center;
  padding: max(6vh, calc(env(safe-area-inset-top, 0px) + 12px)) 12px calc(24px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
}
.dialog {
  position: relative; width: 100%; background: var(--popover); color: var(--popover-foreground);
  border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lift); padding: 20px;
  animation: dlg-in .16s ease-out;
}
@keyframes dlg-in { from { opacity: 0; transform: translateY(6px) scale(.99); } to { opacity: 1; transform: none; } }
.dialog-x { position: absolute; top: 10px; right: 10px; }
.dialog h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; padding-right: 36px; }
.dialog .sub { color: var(--muted-foreground); font-size: 13px; }
.dlg-body { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.pop-wrap { position: relative; display: inline-flex; }
.pop {
  position: absolute; top: calc(100% + 6px); z-index: 60; background: var(--popover); color: var(--popover-foreground);
  border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lift); padding: 6px;
  max-height: min(70vh, 540px); overflow: auto; animation: dlg-in .12s ease-out;
}
.pop-start { left: 0; }
.pop-end { right: 0; }
.menu-item {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: 0; background: none;
  border-radius: 6px; text-align: left; font-size: 13px; cursor: pointer;
}
.menu-item:hover { background: var(--muted); }
.menu-item.on { background: color-mix(in srgb, var(--primary) 14%, transparent); }
.menu-item .trail { margin-left: auto; color: var(--primary); }
.menu-label { font-size: 12px; font-weight: 600; color: var(--muted-foreground); padding: 8px 8px 4px; }
.menu-sub { font-size: 12px; color: var(--muted-foreground); padding: 0 8px 6px; overflow: hidden; text-overflow: ellipsis; }
.sep { height: 1px; background: var(--border); margin: 6px 0; }
.swatch { width: 18px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* Avatares */
.av {
  display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;
  color: #fff; font-weight: 600; flex-shrink: 0; line-height: 1; user-select: none; letter-spacing: 0;
}
.av-stack { display: flex; margin-left: auto; }
.av-stack .av { box-shadow: 0 0 0 2px var(--card); }
.av-stack .av + .av { margin-left: -4px; }
.av-btn { width: 36px; height: 36px; border-radius: 50%; }

/* Tela inicial: perfis */
.center-page { max-width: 460px; margin: 0 auto; padding: 56px 16px 40px; }
.hero-brand { font-size: 40px; font-weight: 700; letter-spacing: -0.04em; }
.hero-flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 14px 0 18px; font-size: 12px; font-weight: 600; }
.hero-flow span { padding: 3px 9px; border-radius: 999px; background: var(--muted); color: var(--muted-foreground); }
.hero-flow span:last-child { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
.hero-flow .ic { color: var(--muted-foreground); }
.who-list { display: flex; flex-direction: column; gap: 8px; margin: 22px 0 28px; }
.who-btn {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 12px; background: var(--card); cursor: pointer; text-align: left; transition: border-color .15s, box-shadow .15s;
}
.who-btn:hover { border-color: var(--primary); box-shadow: var(--shadow-tile); }
.who-btn strong { display: block; font-weight: 600; }
.who-btn small { display: block; color: var(--muted-foreground); font-size: 12px; }
.who-form { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
.who-form h2 { font-size: 15px; font-weight: 600; }
.loading { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }

/* Meus quadros */
.home { max-width: 1120px; margin: 0 auto; padding: 32px 16px 48px; display: flex; gap: 32px; }
.ws-side { width: 228px; flex-shrink: 0; }
.ws-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.ws-head h2 { font-family: "DM Sans", sans-serif; letter-spacing: 0; font-size: 13px; font-weight: 600; color: var(--muted-foreground); }
.ws-list { display: flex; flex-direction: column; gap: 2px; }
.ws-item { display: flex; align-items: center; gap: 2px; border-radius: 8px; }
.ws-btn {
  flex: 1; min-width: 0; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: none;
  cursor: pointer; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ws-item:hover .ws-btn { background: var(--muted); }
.ws-item.cur .ws-btn { background: color-mix(in srgb, var(--primary) 13%, transparent); color: var(--primary); }
.ws-tools { display: flex; opacity: 0; transition: opacity .15s; }
.ws-item:hover .ws-tools, .ws-item:focus-within .ws-tools { opacity: 1; }
.boards-main { flex: 1; min-width: 0; }
.boards-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.boards-top h1 { font-size: 26px; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 12px; }
.tile {
  position: relative; height: 116px; border-radius: 12px; padding: 14px; color: #fff; cursor: pointer;
  box-shadow: var(--shadow-tile); display: flex; flex-direction: column; justify-content: space-between;
  transition: box-shadow .15s; outline-offset: 2px;
}
.tile:hover { box-shadow: var(--shadow-lift); }
.tile h3 { font-size: 16px; font-weight: 600; text-shadow: 0 1px 2px oklch(0 0 0 / .25); padding-right: 28px; word-break: break-word; }
.tile p { font-size: 12px; opacity: .85; }
.tile-del { position: absolute; top: 8px; right: 8px; opacity: 0; color: #fff; background: oklch(0 0 0 / .22); }
.tile-del:hover:not(:disabled) { background: oklch(0 0 0 / .4); }
.tile:hover .tile-del, .tile:focus-within .tile-del { opacity: 1; }
.tile.over { outline: 2px dashed var(--primary); }
.tile.dragging { opacity: .5; }
.tile-new {
  height: 116px; border-radius: 12px; border: 1px dashed var(--border); background: var(--muted);
  color: var(--muted-foreground); display: flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 500; cursor: pointer; transition: color .15s, border-color .15s;
}
.tile-new:hover { color: var(--foreground); border-color: var(--primary); }
.bg-pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.bg-opt { height: 40px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
.bg-opt.on { border-color: var(--foreground); box-shadow: 0 0 0 2px var(--background) inset; }
.preview { height: 84px; border-radius: 10px; padding: 12px; color: #fff; font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 16px; }
.empty-box { border: 1px dashed var(--border); border-radius: 14px; padding: 28px; max-width: 520px; margin: 40px auto; background: var(--card); }
.empty-box h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.people-list { display: flex; flex-direction: column; gap: 6px; }
.person-row { display: flex; align-items: center; gap: 10px; padding: 6px 4px; }
.person-row .info { flex: 1; min-width: 0; }
.person-row small { display: block; color: var(--muted-foreground); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--muted); color: var(--muted-foreground); }
.note-box { font-size: 12px; color: var(--muted-foreground); background: var(--muted); border-radius: 8px; padding: 10px 12px; }

/* Quadro */
.board { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.board-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; }
.board-title {
  font-family: "Space Grotesk", sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #fff;
  text-shadow: 0 1px 3px oklch(0 0 0 / .3); background: none; border: 0; cursor: text;
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 8px;
}
.board-title .ic { opacity: 0; transition: opacity .15s; }
.board-title:hover { background: oklch(1 0 0 / .14); }
.board-title:hover .ic { opacity: .8; }
.board-title-inp { width: 280px; max-width: 100%; height: 38px; font-family: "Space Grotesk", sans-serif; font-size: 18px; font-weight: 700; }
.board-ws { color: oklch(1 0 0 / .8); font-size: 12px; }
.board-tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.on-bg { background: color-mix(in srgb, var(--background) 92%, transparent); }
.filter-inp { width: 180px; height: 32px; font-size: 13px; }
.f-sec { padding: 6px 6px 10px; }
.f-h { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.f-due { display: flex; flex-wrap: wrap; gap: 4px; }
.board-area { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.layout-seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; }
.layout-seg button {
  width: 30px; height: 28px; border: 0; border-radius: 7px; background: none; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; color: var(--muted-foreground);
}
.layout-seg button:hover { color: var(--foreground); }
.layout-seg button.on { background: var(--card); color: var(--foreground); box-shadow: var(--shadow-tile); }
.layout-seg button:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.canvas.lay-grid, .canvas.lay-column { overflow-x: hidden; overflow-y: auto; padding-bottom: 84px; }
.canvas.lay-grid, .row-lists.lay-grid { flex-wrap: wrap; align-content: flex-start; }
.canvas.lay-column, .row-lists.lay-column { flex-direction: column; align-items: stretch; }

<script>

const { useState, useEffect, useRef, useMemo, useSyncExternalStore, Fragment } = React;
const html = htm.bind(React.createElement);

/* ---------- Utilitários ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* armazenamento indisponível */ } },
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const now = () => new Date().toISOString();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const byPos = (a, b) => (a.position ?? 0) - (b.position ?? 0);

/** Posição fracionária entre dois vizinhos (padrão Trello). */
function positionBetween(before, after) {
  if (before === undefined && after === undefined) return 1000;
  if (before === undefined) return after / 2;
  if (after === undefined) return before + 1000;
  return (before + after) / 2;
}
function initials(name) {
  const base = (name || '?').trim() || '?';
  const p = base.split(/\s+/);
  return (((p[0] || '')[0] || '') + ((p[1] || '')[0] || '')).toUpperCase() || base[0].toUpperCase();
}
function hueOf(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function parseDay(s) { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function dueState(due, completed) {
  if (!due) return 'none';
  if (completed) return 'done';
  const end = parseDay(due); end.setHours(23, 59, 59, 999);
  const diff = end.getTime() - Date.now();
  if (diff < 0) return 'overdue';
  if (diff < 864e5) return 'soon';
  return 'upcoming';
}
const fmtDay = (s) => parseDay(s).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
const fmtDayLong = (s) => parseDay(s).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
const fmtWhen = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

const BACKGROUNDS = [
  { key: 'aurora', label: 'Aurora' }, { key: 'citrus', label: 'Cítrico' }, { key: 'forest', label: 'Floresta' },
  { key: 'dusk', label: 'Crepúsculo' }, { key: 'slate', label: 'Ardósia' }, { key: 'rose', label: 'Rosé' },
];
const bgStyle = (key) => ({ backgroundImage: `var(--bg-${BACKGROUNDS.some((b) => b.key === key) ? key : 'aurora'})` });
const LABEL_COLORS = ['green', 'yellow', 'orange', 'red', 'purple', 'blue', 'sky', 'lime', 'pink', 'gray'];
const LABEL_NAMES = { green: 'Verde', yellow: 'Amarelo', orange: 'Laranja', red: 'Vermelho', purple: 'Roxo', blue: 'Azul', sky: 'Céu', lime: 'Lima', pink: 'Rosa', gray: 'Cinza' };
const lblStyle = (c) => ({ backgroundColor: `var(--label-${c})` });
const NOTE_COLORS = { yellow: '#fde68a', pink: '#fbcfe8', green: '#bbf7d0', blue: '#bfdbfe' };
const NOTE_NAMES = { yellow: 'amarelo', pink: 'rosa', green: 'verde', blue: 'azul' };
const DEFAULT_LIST_W = 248;

/* ---------- Markdown simples e seguro ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
}
function renderMd(src) {
  const lines = esc(src || '').split(/\r?\n/);
  let out = ''; let list = null; let para = [];
  const flushP = () => { if (para.length) { out += '<p>' + para.map(inlineMd).join('<br>') + '</p>'; para = []; } };
  const flushL = () => { if (list) { out += `<${list.t}>` + list.items.map((i) => '<li>' + inlineMd(i) + '</li>').join('') + `</${list.t}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, ''); let m;
    if (!line.trim()) { flushP(); flushL(); continue; }
    if ((m = line.match(/^\s*#{1,6}\s+(.*)$/))) { flushP(); flushL(); out += '<h4>' + inlineMd(m[1]) + '</h4>'; continue; }
    if ((m = line.match(/^\s*[-*+]\s+(?:\[( |x|X)\]\s+)?(.*)$/))) {
      flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; }
      list.items.push((m[1] !== undefined ? (m[1].trim() ? '☑ ' : '☐ ') : '') + m[2]); continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { flushP(); flushL(); out += '<blockquote>' + inlineMd(m[1]) + '</blockquote>'; continue; }
    flushL(); para.push(line);
  }
  flushP(); flushL();
  return out;
}

/* ---------- Avisos (toasts) ---------- */
const ToastStore = { list: [], subs: new Set(), v: 0 };
function toastEmit() { ToastStore.v++; ToastStore.subs.forEach((f) => f()); }
function toast(msg, kind = 'info') {
  const t = { id: uid(), msg, kind };
  ToastStore.list = [...ToastStore.list, t].slice(-4); toastEmit();
  setTimeout(() => { ToastStore.list = ToastStore.list.filter((x) => x.id !== t.id); toastEmit(); }, kind === 'error' ? 6500 : 3600);
}

/* ---------- Banco de dados ----------
 * No link publicado, os dados ficam no banco compartilhado do artifact (tempo real
 * para todos que abrem o link). Sem ele (prévia ou sem acesso), tudo fica no navegador.
 */
const SHARED = ['people', 'workspaces', 'boards', 'lists', 'cards'];
const Data = { people: {}, workspaces: {}, boards: {}, lists: {}, cards: {}, notes: {} };

let version = 0; const subs = new Set();
function emit() { version++; subs.forEach((f) => f()); }
function subscribeData(f) { subs.add(f); return () => subs.delete(f); }

const LOCAL_KEY = 'flowtify:local:v1';
const NOTES_KEY = 'flowtify:notes:v1';
let saveTimer = 0;
function saveLocalNow() {
  clearTimeout(saveTimer); saveTimer = 0;
  if (Backend.mode === 'local') { const o = {}; for (const c of SHARED) o[c] = Data[c]; LS.set(LOCAL_KEY, o); }
  if (Backend.notesMode === 'local') LS.set(NOTES_KEY, Data.notes);
}
function saveLocalSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveLocalNow, 150); }
window.addEventListener('pagehide', () => { if (saveTimer) saveLocalNow(); });

// Fila de escrita: uma escrita por vez por documento, com no máximo 6 em paralelo.
const queue = new Map();

function mergeOp(prev, op) {
  if (!prev || op.t !== 'update') return op;
  if (prev.t === 'del') return prev;
  return { t: prev.t, d: { ...prev.d, ...op.d } };
}
function applyOp(map, id, op) {
  if (!op) return;
  if (op.t === 'del') delete map[id];
  else if (op.t === 'set') map[id] = { ...op.d, id };
  else if (map[id]) map[id] = { ...map[id], ...op.d };
}
const isLocal = (col) => (col === 'notes' ? Backend.notesMode === 'local' : Backend.mode === 'local');
function write(col, id, op) {
  if (isLocal(col)) { saveLocalSoon(); return; }
  const key = col + '|' + id;
  let e = queue.get(key);
  if (!e) { e = { col, id, inflight: null, next: null }; queue.set(key, e); }
  e.next = mergeOp(e.next, op);
  if (!e.inflight) drain(key, e);
}
async function drain(key, e) {
  while (e.next) {
    const op = e.next; e.next = null; e.inflight = op;
    await acquireSlot();
    try { await perform(e.col, e.id, op, 0); } catch (err) { reportWriteError(err); } finally { releaseSlot(); }
    e.inflight = null;
  }
  if (queue.get(key) === e) queue.delete(key);
}
async function perform(col, id, op, attempt) {
  const ref = Backend.db.collection(col === 'notes' ? Backend.notesPath : col).doc(id);
  try {
    if (op.t === 'set') await ref.set(op.d);
    else if (op.t === 'update') await ref.update(op.d);
    else await ref.delete();
  } catch (err) {
    const code = err && err.code;
    if ((code === 'unavailable' || code === 'resource_exhausted') && attempt < 2) {
      await sleep(600 * (attempt + 1) + Math.random() * 600);
      return perform(col, id, op, attempt + 1);
    }
    throw err;
  }
}
function warnOnce(key, msg) { if (Backend.warned[key]) return; Backend.warned[key] = true; toast(msg, 'error'); setTimeout(() => { Backend.warned[key] = false; }, 20000); }
function reportWriteError(err) {
  const code = err && err.code;
  if (code === 'invalid_argument') warnOnce('ro', 'Não foi possível salvar: seu acesso a este app é só de leitura. Peça acesso de colaborador a quem compartilhou o link.');
  else if (code === 'quota_exceeded') warnOnce('quota', 'O espaço de armazenamento está cheio. Exclua quadros ou cartões antigos para continuar salvando.');
  else if (code === 'revoked') warnOnce('rev', 'O acesso a este app mudou. Recarregue a página.');
  else warnOnce('net', 'Uma alteração não foi salva. Verifique a conexão e tente de novo.');
}
function clean(obj) { const o = JSON.parse(JSON.stringify(obj)); delete o.id; return o; }
function put(col, id, obj) { const d = clean(obj); Data[col] = { ...Data[col], [id]: { ...d, id } }; emit(); write(col, id, { t: 'set', d }); }
function patch(col, id, p) {
  const cur = Data[col][id]; if (!cur) return;
  const d = clean(p); Data[col] = { ...Data[col], [id]: { ...cur, ...d } }; emit(); write(col, id, { t: 'update', d });
}
function remove(col, id) { if (!Data[col][id]) return; const m = { ...Data[col] }; delete m[id]; Data[col] = m; emit(); write(col, id, { t: 'del' }); }
function removeMany(col, ids) {
  if (!ids.length) return; const m = { ...Data[col] };
  for (const id of ids) delete m[id]; Data[col] = m; emit();
  for (const id of ids) write(col, id, { t: 'del' });
}

function onSnap(col, snap) {
  const m = {};
  for (const d of snap.docs) { const v = d.data(); if (v) m[d.id] = { ...v, id: d.id }; }
  for (const e of queue.values()) { if (e.col !== col) continue; applyOp(m, e.id, e.inflight); applyOp(m, e.id, e.next); }
  Data[col] = m; Backend.ready.add(col); emit();
}
function listen(col, path) {
  const start = () => {
    Backend.db.collection(path).onSnapshot((s) => onSnap(col, s), (err) => {
      const code = err && err.code;
      Backend.ready.add(col); emit();
      if (code === 'unavailable' || code === 'resource_exhausted') setTimeout(start, 4000);
      else if (code === 'revoked') warnOnce('rev', 'O acesso a este app mudou. Recarregue a página.');
    });
  };
  start();
}
function loadLocalNotes() { Backend.notesMode = 'local'; Data.notes = LS.get(NOTES_KEY, {}) || {}; Backend.ready.add('notes'); }
function startLocal() {
  Backend.mode = 'local';
  const o = LS.get(LOCAL_KEY, {}) || {};
  for (const c of SHARED) { Data[c] = o[c] || {}; Backend.ready.add(c); }
  loadLocalNotes(); emit();
}
async function initBackend() {
  if (!window.claude || typeof window.claude.use !== 'function') { startLocal(); return; }
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { startLocal(); return; }
  Backend.db = db; Backend.mode = 'db';
  for (const c of SHARED) listen(c, c);
  emit();
  // Post-its são privados: ficam na área pessoal de cada conta.
  let id = null;
  try { const u = await window.claude.use('user'); id = u ? await u.id() : null; } catch (e) { id = null; }
  if (id) {
    try { const path = 'data/users/' + id; db.collection(path); Backend.notesPath = path; Backend.notesMode = 'db'; listen('notes', path); }
    catch (e) { loadLocalNotes(); }
  } else loadLocalNotes();
  emit();
}

/* ---------- Pessoa atual ---------- */
const Me = { id: LS.get('flowtify:me', null) };
function setMe(id) { Me.id = id; LS.set('flowtify:me', id); emit(); }

/* ---------- Consultas ---------- */
const byCreated = (a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
function myWorkspaces() { return Object.values(Data.workspaces).filter((w) => (w.memberIds || []).includes(Me.id)).sort(byCreated); }
function boardsOf(wsId) { return Object.values(Data.boards).filter((b) => b.workspaceId === wsId).sort(byPos); }
function listsOf(boardId) { return Object.values(Data.lists).filter((l) => l.boardId === boardId).sort(byPos); }
function cardsOfBoard(boardId) { return Object.values(Data.cards).filter((c) => c.boardId === boardId); }
function cardsOfList(listId) { return Object.values(Data.cards).filter((c) => c.listId === listId).sort(byPos); }
function membersOfWs(ws) { return (ws?.memberIds || []).map((id) => Data.people[id]).filter(Boolean); }
function canSeeBoard(b) { const ws = b && Data.workspaces[b.workspaceId]; return !!ws && (ws.memberIds || []).includes(Me.id); }
function personName(id) { return Data.people[id]?.name || 'Alguém'; }
function lastPos(listId, exceptId) {
  let m = 0;
  for (const c of Object.values(Data.cards)) if (c.listId === listId && c.id !== exceptId && c.position > m) m = c.position;
  return m;
}

/* ---------- Ações ---------- */
function logged(card, ...actions) {
  let acts = card.activities || [];
  for (const a of actions) acts = [{ id: uid(), personId: Me.id, action: a, at: now() }, ...acts];
  return acts.slice(0, 40);
}
function cardDefaults() {
  return {
    description: '', startDate: null, dueDate: null, isCompleted: false, isTask: false,
    labelIds: [], memberIds: [], checklists: [], attachments: [], comments: [], activities: [],
    pipelineListIds: [], pipelineAuto: true, pipelineOwners: [],
  };
}
function createWorkspace(name) {
  const id = uid();
  put('workspaces', id, { name, ownerId: Me.id, memberIds: [Me.id], createdAt: now() });
  return id;
}
function createBoard(wsId, title, background) {
  const id = uid();
  const pos = Math.max(0, ...boardsOf(wsId).map((b) => b.position || 0)) + 1000;
  put('boards', id, {
    workspaceId: wsId, title, background, position: pos, createdAt: now(), createdBy: Me.id,
    labels: [{ id: uid(), name: 'Urgente', color: 'red' }, { id: uid(), name: 'Melhoria', color: 'green' }, { id: uid(), name: 'Bug', color: 'orange' }],
  });
  ['A Fazer', 'Em Andamento', 'Concluído'].forEach((t, i) => put('lists', uid(), { boardId: id, title: t, position: (i + 1) * 1000 }));
  return id;
}
function deleteBoard(id) {
  removeMany('cards', cardsOfBoard(id).map((c) => c.id));
  removeMany('lists', listsOf(id).map((l) => l.id));
  removeMany('notes', Object.values(Data.notes).filter((n) => n.boardId === id).map((n) => n.id));
  remove('boards', id);
}
function deleteWorkspace(id) { boardsOf(id).forEach((b) => deleteBoard(b.id)); remove('workspaces', id); }
/* Marcador de dias: a lista fica em dia quando todos os cartões dela são concluídos.
 * Contam só dias úteis (segunda a sexta). */
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const todayStr = () => ymd(new Date());
const isBizDay = (d) => d.getDay() !== 0 && d.getDay() !== 6;
function prevBizDay(d) { const x = new Date(d); do { x.setDate(x.getDate() - 1); } while (!isBizDay(x)); return x; }
function lateLists(lists, tracking) {
  return lists.map((l) => ({ l, s: listStatus(l, tracking) })).filter((x) => x.s && x.s.k === 'late' && cardsOfList(x.l.id).length > 0);
}
const daysTxt = (n) => plural(n, 'dia', 'dias');

/* Repetição de tarefas: em cada data marcada a tarefa precisa ser concluída;
 * se a data passar sem conclusão, ela fica atrasada. doneFor = data de execução que a conclusão cobre. */
const WD_FULL = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const WD_SHORT = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const WD_ORDER = [1, 2, 3, 4, 5, 6, 0];
function occursOn(sch, d) {
  if (!sch) return false;
  if (sch.type === 'weekly') return (sch.days || []).includes(d.getDay());
  if (sch.type === 'monthly') { const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return d.getDate() === Math.min(sch.day || 1, last); }
  return false;
}
function lastOccurrence(sch, today) {
  const since = sch.since || '2000-01-01'; const x = new Date(today);
  for (let i = 0; i < 400; i++) { const k = ymd(x); if (k < since) return null; if (occursOn(sch, x)) return k; x.setDate(x.getDate() - 1); }
  return null;
}
function nextOccurrence(sch, afterStr) {
  const x = parseDay(afterStr);
  for (let i = 0; i < 400; i++) { x.setDate(x.getDate() + 1); if (occursOn(sch, x)) return ymd(x); }
  return null;
}
function schedStatusRaw(sch, doneFor, lastDone) {
  if (!sch || !sch.type) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0); const t = ymd(today);
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  doneFor = doneFor || null;
  const P = lastOccurrence(sch, yest);   // última data antes de hoje
  const L = lastOccurrence(sch, today);  // última data até hoje (inclusive)
  if (P && !(doneFor && doneFor >= P)) {
    // Atrasada: primeira data perdida depois da última conclusão.
    const startStr = doneFor && doneFor >= (sch.since || '') ? doneFor : null;
    const x = parseDay(startStr || sch.since || P); if (startStr) x.setDate(x.getDate() + 1);
    let first = null; let n = 0;
    for (let i = 0; i < 800 && ymd(x) <= P; i++) { if (occursOn(sch, x)) { if (!first) first = ymd(x); n++; } x.setDate(x.getDate() + 1); }
    return { k: 'late', last: L, since: first || P, missed: Math.max(1, n) };
  }
  if (L === t && !(doneFor && doneFor >= L)) return { k: 'due', last: L };
  // Marcada no dia em que foi feita, ou até a data que uma conclusão antecipada cobre.
  if (doneFor && (doneFor >= t || lastDone === t)) return { k: 'done', doneFor, next: nextOccurrence(sch, doneFor > t ? doneFor : t) };
  return { k: 'upcoming', next: nextOccurrence(sch, t) };
}
function schedStatus(card) { return card.schedule && card.schedule.type ? schedStatusRaw(card.schedule, card.doneFor, card.lastDoneDate) : null; }
/** Prazo de uma lista: repetição própria ou, com o marcador de dias, todo dia útil. */
function listStatus(list, tracking) {
  const custom = !!(list.schedule && list.schedule.type);
  if (!custom && !tracking) return null;
  const sch = custom ? list.schedule : { type: 'weekly', days: [1, 2, 3, 4, 5], since: list.lastDoneDate ? '2000-01-01' : todayStr() };
  const st = schedStatusRaw(sch, custom ? list.doneFor : list.lastDoneDate, list.lastDoneDate);
  return { ...st, custom, sch };
}
function dayStatus(list) {
  const st = listStatus({ ...list, schedule: null }, true);
  return st.k === 'late' ? { k: 'late', n: st.missed } : st.k === 'due' ? { k: 'today' } : { k: 'ok' };
}
function schedLabel(s) {
  if (!s || !s.type) return '';
  if (s.type === 'monthly') return `Todo dia ${s.day}`;
  const d = WD_ORDER.filter((x) => (s.days || []).includes(x));
  if (d.join() === '1,2,3,4,5') return 'Dias úteis';
  if (d.length === 7) return 'Todo dia';
  if (d.length === 1) return (d[0] === 0 || d[0] === 6 ? 'Todo ' : 'Toda ') + WD_FULL[d[0]];
  const names = d.map((x) => WD_SHORT[x]);
  return names.slice(0, -1).join(', ') + ' e ' + names[names.length - 1];
}
const fmtWd = (s) => parseDay(s).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }).replace('.', '');
function schedText(st) {
  if (!st) return '';
  if (st.k === 'due') return 'vence hoje';
  if (st.k === 'late') return `atrasada desde ${fmtWd(st.since)}`;
  if (st.k === 'done') return st.doneFor > todayStr() ? `feita, vale para ${fmtWd(st.doneFor)}` : 'feita hoje';
  return st.next ? `próxima: ${fmtWd(st.next)}` : '';
}
/** Conta como concluído para o marcador de dias da lista. */
function countsAsDone(c) {
  if (c.schedule && c.schedule.type) { const st = schedStatus(c); return st.k === 'done' || st.k === 'upcoming'; }
  return !!c.isCompleted;
}
/** Marcar ou desmarcar uma tarefa (com ou sem repetição). */
/** Desmarca qualquer cartão; numa tarefa com repetição, desfaz a última conclusão (volta a ficar pendente). */
function uncheckCard(card) {
  if (card.schedule && card.schedule.type) {
    patch('cards', card.id, { isCompleted: false, doneFor: card.prevDoneFor || null, prevDoneFor: null, lastDoneDate: card.prevLastDone || null, prevLastDone: null });
  } else patch('cards', card.id, { isCompleted: false });
}
function checkTask(card, v) {
  if (!card.schedule || !card.schedule.type) {
    patch('cards', card.id, { isCompleted: v, lastDoneDate: v ? todayStr() : (card.lastDoneDate || null), activities: logged(card, v ? 'concluiu a tarefa' : 'reabriu a tarefa') });
    return;
  }
  if (v) {
    const st = schedStatus(card);
    const cover = st.k === 'due' || st.k === 'late' ? st.last : st.next;

    patch('cards', card.id, { isCompleted: false, doneFor: card.prevDoneFor || null, prevDoneFor: null, lastDoneDate: card.prevLastDone || null, prevLastDone: null, activities: logged(card, 'reabriu a tarefa') });

/* Linhas do quadro: cada lista pertence a uma linha; sem linha válida, fica na primeira. */
function boardRows(board) { return (board && board.rows) || []; }
function effRowId(list, rows) { return rows.some((r) => r.id === list.rowId) ? list.rowId : (rows[0]?.id ?? null); }
function orderedLists(board) {
  const lists = listsOf(board.id); const rows = boardRows(board);
  if (!rows.length) return lists;
  const out = [];
  for (const r of rows) for (const l of lists) if (effRowId(l, rows) === r.id) out.push(l);
  return out;
}
/** Grava a linha de cada lista que ainda não tem uma válida, para que nada mude de lugar sozinho. */
function pinLists(boardId, rows) {
  if (!rows.length) return;
  for (const l of listsOf(boardId)) if (!rows.some((r) => r.id === l.rowId)) patch('lists', l.id, { rowId: rows[0].id });
}
function addRow(board, name) {
  const id = uid();
  const rows = [...boardRows(board), { id, name }];

}

  const rows = [...boardRows(board)]; const i = rows.findIndex((r) => r.id === rowId); const j = i + delta;
  if (i < 0 || j < 0 || j >= rows.length) return;
  pinLists(board.id, rows);
  [rows[i], rows[j]] = [rows[j], rows[i]]; patch('boards', board.id, { rows });
}
function deleteRow(board, rowId) {
  const rows = boardRows(board); const i = rows.findIndex((r) => r.id === rowId);
  pinLists(board.id, rows);
  const target = rows[i - 1] || rows[i + 1] || null;
  const all = listsOf(board.id);
  let base = Math.max(0, ...all.map((l) => l.position || 0));
  for (const l of all.filter((x) => effRowId(x, rows) === rowId)) { base += 1000; patch('lists', l.id, { rowId: target ? target.id : null, position: base }); }
  patch('boards', board.id, { rows: rows.filter((r) => r.id !== rowId) });

}

  const lists = listsOf(list.boardId);
  const i = lists.findIndex((l) => l.id === list.id);

  put('lists', nid, { boardId: list.boardId, schedule: list.schedule && list.schedule.type ? { ...list.schedule, since: todayStr() } : null, rowId: effRowId(list, boardRows(Data.boards[list.boardId])), title: `${list.title} (cópia)`, position: positionBetween(list.position, lists[i + 1]?.position) });
  for (const c of cardsOfList(list.id)) {
    put('cards', uid(), {
      ...cardDefaults(), boardId: c.boardId, listId: nid, title: c.title, description: c.description || '',
      position: c.position, isTask: !!c.isTask, isCompleted: false, createdAt: now(), createdBy: Me.id,
      schedule: c.schedule && c.schedule.type ? { ...c.schedule, since: todayStr() } : null,
    });
  }
  toast('Lista duplicada', 'success');
}

/**
 * Esteira automática: quando todos os itens do checklist ficam concluídos, o cartão
 * avança para a próxima lista da sequência; o responsável da etapa assume o cartão;
 * na última etapa ele é marcado como concluído.
 */
function pipelineAdvance(card) {
  if (!card.pipelineAuto) return null;
  const steps = card.pipelineListIds || [];
  if (steps.length < 2) return null;
  const i = steps.indexOf(card.listId);
  if (i < 0 || i === steps.length - 1) return null;
  const items = (card.checklists || []).flatMap((c) => c.items || []);
  if (!items.length || items.some((x) => !x.checked)) return null;
  const nextId = steps[i + 1];
  const target = Data.lists[nextId];
  if (!target) return null;
  const isLast = i + 1 === steps.length - 1;
  const owner = (card.pipelineOwners || []).find((o) => o.listId === nextId)?.personId;
  const acts = [`esteira: moveu o cartão para “${target.title}”`];
  const out = { listId: nextId, position: lastPos(nextId, card.id) + 1000 };
  if (isLast) out.isCompleted = true;
  if (owner && Data.people[owner]) { out.memberIds = [owner]; acts.push(`esteira: cartão atribuído a ${Data.people[owner].name}`); }
  out.activities = logged(card, ...acts);
  return { patch: out, target, owner: owner && Data.people[owner] };
}

}
