/** Editor da esteira: sequência de listas e responsável por etapa. */
function PipelineEditor({ lists, value, auto, onChange, onAutoChange, members = [], owners = [], onOwnersChange, currentListId }) {
  const titleOf = (id) => lists.find((l) => l.id === id)?.title ?? 'Lista removida';
  const available = lists.filter((l) => !value.includes(l.id));
  const ownerOf = (id) => owners.find((o) => o.listId === id)?.personId || '';
  function mv(i, delta) {
    const n = [...value]; const j = i + delta;
    if (j < 0 || j >= n.length) return;
    [n[i], n[j]] = [n[j], n[i]]; onChange(n);
  }
  function setOwner(listId, pid) {
    const n = owners.filter((o) => o.listId !== listId);
    if (pid) n.push({ listId, personId: pid });
    onOwnersChange(n);
  }
  return html`<div className="pipe">
    <p className="pipe-h"><${Icon} n="moveRight" s=${14} /> Esteira automática</p>
    ${value.length > 0 && html`<ol className="pipe-steps">
      ${value.map((id, i) => html`<li key=${id} className=${'pipe-step' + (id === currentListId ? ' cur' : '')}>
        <div className="pipe-row">
          <span className="pipe-n">${i + 1}.</span>
          <span className="pipe-t" title=${titleOf(id)}>${titleOf(id)}</span>
          <button className="btn btn-ghost btn-icon btn-xs" aria-label="Subir etapa" disabled=${i === 0} onClick=${() => mv(i, -1)}><${Icon} n="arrowUp" s=${12} /></button>
          <button className="btn btn-ghost btn-icon btn-xs" aria-label="Descer etapa" disabled=${i === value.length - 1} onClick=${() => mv(i, 1)}><${Icon} n="arrowDown" s=${12} /></button>
          <button className="btn btn-ghost btn-icon btn-xs" aria-label="Remover etapa" onClick=${() => onChange(value.filter((v) => v !== id))}><${Icon} n="x" s=${12} /></button>
        </div>
        ${onOwnersChange && members.length > 0 && html`<select className="inp inp-sm" style=${{ height: 26, fontSize: 11.5 }} value=${ownerOf(id)}
            aria-label=${'Responsável pela etapa ' + titleOf(id)} onChange=${(e) => setOwner(id, e.target.value)}>
            <option value="">Sem responsável</option>
            ${members.map((m) => html`<option key=${m.id} value=${m.id}>${m.name}</option>`)}
          </select>`}
      </li>`)}
    </ol>`}
    ${available.length > 0 && html`<select className="inp inp-sm" value="" aria-label="Adicionar etapa à esteira"
        onChange=${(e) => { if (e.target.value) onChange([...value, e.target.value]); }}>
        <option value="">+ Adicionar etapa…</option>
        ${available.map((l) => html`<option key=${l.id} value=${l.id}>${l.title}</option>`)}
      </select>`}
    <label className="pipe-auto"><span>Avançar ao concluir o checklist</span>
      <input type="checkbox" className="switch" checked=${!!auto} aria-label="Avanço automático" onChange=${(e) => onAutoChange(e.target.checked)} /></label>
  </div>`;
}

/* ---------- Post-its (privados de cada pessoa) ---------- */
function StickyNotes({ boardId }) {
  useData();
  const notes = Object.values(Data.notes).filter((n) => n.boardId === boardId && n.personId === Me.id).sort(byCreated);
  function add() {
    // Nasce perto do botão Post-it, no canto inferior direito, para não cobrir os cartões.
    const off = (notes.length % 6) * 24;
    const area = document.querySelector('.board-area');
    const r = area ? area.getBoundingClientRect() : { width: 900, height: 600 };
    const x = Math.max(0, Math.round(r.width - 220 - 24 - off));
    const y = Math.max(0, Math.round(r.height - 170 - 64 - off));
    put('notes', uid(), { boardId, personId: Me.id, content: '', color: 'yellow', x, y, w: 220, h: 170, createdAt: now() });
  }
  return html`<${Fragment}>
    ${notes.map((n) => html`<${NoteItem} key=${n.id} note=${n} />`)}
    <button className="btn btn-primary note-add" onClick=${add} title="Criar um lembrete visível só para você"><${Icon} n="sticky" /> Post-it</button>
  <//>`;
}
function NoteItem({ note }) {
  const [live, setLive] = useState(null);
  const [text, setText] = useState(note.content || '');
  const focused = useRef(false);
  const drag = useRef(null);
  const base = useRef(null);
  const elRef = useRef(null);
  useEffect(() => { if (!focused.current) setText(note.content || ''); }, [note.content]);
  const cur = live || { x: note.x, y: note.y, w: note.w || 220, h: note.h || 170 };
  function bounds() {
    const area = elRef.current && elRef.current.closest('.board-area');
    const r = area ? area.getBoundingClientRect() : { width: 4000, height: 4000 };
    return { maxX: Math.max(0, r.width - 60), maxY: Math.max(0, r.height - 40) };
  }
  const clampXY = (x, y) => { const b = bounds(); return { x: Math.round(Math.min(b.maxX, Math.max(0, x))), y: Math.round(Math.min(b.maxY, Math.max(0, y))) }; };
  return html`<div className="note" ref=${elRef} style=${{ left: cur.x, top: cur.y, width: cur.w, height: cur.h, background: NOTE_COLORS[note.color] || NOTE_COLORS.yellow }}>
    <div className="note-bar" title="Arraste para mover"
      onPointerDown=${(e) => { if (e.target.closest('button')) return; drag.current = { sx: e.clientX, sy: e.clientY, x: cur.x, y: cur.y }; e.currentTarget.setPointerCapture(e.pointerId); }}
      onPointerMove=${(e) => { const d = drag.current; if (!d) return; setLive({ ...cur, ...clampXY(d.x + e.clientX - d.sx, d.y + e.clientY - d.sy) }); }}
      onPointerUp=${(e) => {
        const d = drag.current; drag.current = null; if (!d) return;
        const p = clampXY(d.x + e.clientX - d.sx, d.y + e.clientY - d.sy);
        if (p.x !== note.x || p.y !== note.y) patch('notes', note.id, p);
        setLive(null);
      }}
      onPointerCancel=${() => { drag.current = null; setLive(null); }}>
      ${Object.entries(NOTE_COLORS).map(([name, c]) => html`<button key=${name} className=${'note-dot' + (note.color === name ? ' on' : '')}
          aria-label=${'Cor ' + NOTE_NAMES[name]} title=${'Cor ' + NOTE_NAMES[name]} style=${{ background: c }} onClick=${() => patch('notes', note.id, { color: name })}></button>`)}
      <button className="note-del" aria-label="Excluir post-it" title="Excluir post-it" onClick=${() => remove('notes', note.id)}><${Icon} n="trash" s=${14} /></button>
    </div>
    <textarea value=${text} placeholder="Escreva um lembrete…" aria-label="Texto do post-it"
      onFocus=${() => { focused.current = true; }} onChange=${(e) => setText(e.target.value)}
      onBlur=${() => { focused.current = false; if (text !== (note.content || '')) patch('notes', note.id, { content: text }); }}></textarea>
    <${ResizeHandle} label="Redimensionar post-it" onDrag=${(dx, dy, phase) => {
      if (phase === 'start') { base.current = { ...cur }; return; }
      if (phase === 'cancel') { setLive(null); return; }
      const b = base.current || cur;
      const next = { ...b, w: Math.round(Math.max(140, b.w + dx)), h: Math.round(Math.max(100, b.h + dy)) };
      if (phase === 'end') { if (next.w !== note.w || next.h !== note.h) patch('notes', note.id, { w: next.w, h: next.h }); setLive(null); }
      else setLive(next);
    }} />
  </div>`;
}
</script>
<script>
/* ---------- Janela do cartão ---------- */
function CardModal({ cardId, board, lists, members, labels, onClose }) {
  useData();
  const card = Data.cards[cardId];
  const [title, setTitle] = useState(card?.title || '');
  const titleFocused = useRef(false);
  const [editingDesc, setEditingDesc] = useState(false);
  const [desc, setDesc] = useState('');
  const [comment, setComment] = useState('');
  const [panel, setPanel] = useState(null);
  const [confirmDel, setConfirmDel] = useState(false);
  const [lblName, setLblName] = useState('');
  const [lblColor, setLblColor] = useState('blue');
  const titleRef = useRef(null);
  useEffect(() => { if (card && !titleFocused.current) setTitle(card.title); }, [card?.title]);
  useEffect(() => { const el = titleRef.current; if (el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } });
  if (!card) return null;

  const p = (fields, ...acts) => patch('cards', card.id, acts.length ? { ...fields, activities: logged(card, ...acts) } : fields);
  const idx = lists.findIndex((l) => l.id === card.listId);
  const curList = lists[idx];
  const prevList = idx > 0 ? lists[idx - 1] : null;
  const nextList = idx >= 0 && idx < lists.length - 1 ? lists[idx + 1] : null;
  const checklists = card.checklists || [];

  function moveTo(target, extraAct) {
    const acts = extraAct ? [extraAct, `moveu o cartão para “${target.title}”`] : [`moveu o cartão para “${target.title}”`];
    p({ listId: target.id, position: lastPos(target.id, card.id) + 1000, isCompleted: false }, ...acts);
    toast(`Movido para “${target.title}”`, 'success');
  }
  function toggleDone(v) {
    if (card.isTask) { checkTask(card, v); return; }
    if (v && !card.isTask && nextList) { moveTo(nextList, 'marcou como concluído'); return; }
    p({ isCompleted: v }, v ? (card.isTask ? 'concluiu a tarefa' : 'marcou como concluído') : (card.isTask ? 'reabriu a tarefa' : 'reabriu o cartão'));
  }
  // Esteira: toda mudança no checklist verifica se o cartão deve avançar.
  function setChecklists(next) {
    const adv = pipelineAdvance({ ...card, checklists: next });
    if (adv) {
      patch('cards', card.id, { checklists: next, ...adv.patch });
      toast(`Checklist concluído — cartão avançou para “${adv.target.title}”${adv.owner ? ` e foi para ${adv.owner.name}` : ''}`, 'success');
    } else patch('cards', card.id, { checklists: next });
  }
  function saveTitle() {
    titleFocused.current = false;
    const v = title.trim();
    if (!v) { setTitle(card.title); return; }
    if (v !== card.title) p({ title: v });
  }
  function addComment() {
    const v = comment.trim(); if (!v) return;
    p({ comments: [...(card.comments || []), { id: uid(), personId: Me.id, content: v, at: now() }] }, 'comentou');
    setComment('');
  }
  function toggleMember(pid) {
    const on = (card.memberIds || []).includes(pid);
    p({ memberIds: on ? card.memberIds.filter((x) => x !== pid) : [...(card.memberIds || []), pid] },
      on ? `removeu ${personName(pid)} do cartão` : `adicionou ${personName(pid)} ao cartão`);
  }
  function toggleLabel(lid) {
    const on = (card.labelIds || []).includes(lid);
    p({ labelIds: on ? card.labelIds.filter((x) => x !== lid) : [...(card.labelIds || []), lid] });
  }
  function createLabel() {
    const name = lblName.trim(); if (!name) return;
    const id = uid();
    patch('boards', board.id, { labels: [...(board.labels || []), { id, name, color: lblColor }] });
    p({ labelIds: [...(card.labelIds || []), id] });
    setLblName('');
  }
  const boardLabels = Data.boards[board.id]?.labels || labels;
  const cardLabels = boardLabels.filter((l) => (card.labelIds || []).includes(l.id));
  const cardMembers = (card.memberIds || []).map((pid) => Data.people[pid]).filter(Boolean);
  const togglePanel = (k) => setPanel((cur) => (cur === k ? null : k));

  const head = html`<div className="cm-head">
      <input type="checkbox" checked=${!!card.isCompleted} aria-label="Concluído"
        title=${!card.isTask && nextList && !card.isCompleted ? `Concluir e mover para “${nextList.title}”` : 'Concluído'} onChange=${(e) => toggleDone(e.target.checked)} />
      <textarea ref=${titleRef} className="cm-title" rows="1" value=${title} aria-label=${card.isTask ? 'Título da tarefa' : 'Título do cartão'}
        onFocus=${() => { titleFocused.current = true; }} onChange=${(e) => setTitle(e.target.value.replace(/\n/g, ' '))} onBlur=${saveTitle}
        onKeyDown=${(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}></textarea>
    </div>
    <p className="cm-where">${card.isTask ? 'Tarefa' : 'Cartão'} na lista ${curList ? `“${curList.title}”` : '—'}, quadro “${board.title}”</p>`;

  if (card.isTask) {
    return html`<${Dialog} open=${true} onClose=${onClose} width=${520} label="Detalhes da tarefa">
      ${head}
      <${ScheduleEditor} card=${card} />
      <button className="btn btn-ghost btn-danger" onClick=${() => { remove('cards', card.id); onClose(); }}><${Icon} n="trash" /> Excluir tarefa</button>
    <//>`;
  }

  return html`<${Dialog} open=${true} onClose=${onClose} width=${800} label="Detalhes do cartão">
    ${head}
    ${(cardLabels.length > 0 || cardMembers.length > 0 || card.dueDate) && html`<div className="row" style=${{ flexWrap: 'wrap', gap: 14, margin: '12px 0 0 34px' }}>
      ${cardMembers.length > 0 && html`<div className="av-stack" style=${{ marginLeft: 0 }}>${cardMembers.map((m) => html`<${Avatar} key=${m.id} person=${m} size=${26} />`)}</div>`}
      ${cardLabels.length > 0 && html`<div className="chips">${cardLabels.map((l) => html`<span key=${l.id} className="chip" style=${lblStyle(l.color)}>${l.name || LABEL_NAMES[l.color]}</span>`)}</div>`}
      ${card.dueDate && html`<span className=${'due due-' + dueState(card.dueDate, card.isCompleted)} style=${{ fontSize: 12 }}><${Icon} n="calendar" s=${12} /> Prazo ${fmtDayLong(card.dueDate)}</span>`}
    </div>`}

    <div className="cm-grid">
      <div style=${{ minWidth: 0 }}>
        <section className="cm-sec">
          <h3><${Icon} n="text" /> Descrição</h3>
          ${editingDesc
            ? html`<div style=${{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <textarea className="inp" rows="7" autoFocus=${true} value=${desc} placeholder="Escreva com Markdown…" aria-label="Descrição"
                  onChange=${(e) => setDesc(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Escape') { e.stopPropagation(); setEditingDesc(false); } }}></textarea>
                <p className="hint">Use **negrito**, *itálico*, listas com - e links colando o endereço.</p>
                <div className="row">
                  <button className="btn btn-primary btn-sm" onClick=${() => { if (desc !== (card.description || '')) p({ description: desc }, 'editou a descrição'); setEditingDesc(false); }}>Salvar</button>
                  <button className="btn btn-ghost btn-sm" onClick=${() => setEditingDesc(false)}>Cancelar</button>
                </div>
              </div>`
            : html`<div className="desc-view" role="button" tabIndex="0" onClick=${(e) => { if (e.target.closest('a')) return; setDesc(card.description || ''); setEditingDesc(true); }}
                onKeyDown=${(e) => { if (e.key === 'Enter') { setDesc(card.description || ''); setEditingDesc(true); } }}>
                ${card.description
                  ? html`<div className="md" dangerouslySetInnerHTML=${{ __html: renderMd(card.description) }}></div>`
                  : html`<span className="muted">Adicionar descrição…</span>`}
              </div>`}
        </section>

        <section className="cm-sec">
          <div className="row" style=${{ justifyContent: 'space-between', marginBottom: 8 }}>
            <h3 style=${{ margin: 0 }}><${Icon} n="checkSquare" /> Checklists</h3>
            <button className="btn btn-secondary btn-sm" onClick=${() => setChecklists([...checklists, { id: uid(), title: 'Checklist', items: [] }])}>
              <${Icon} n="plus" s=${14} /> Novo checklist</button>
          </div>
          ${checklists.length === 0 && html`<p className="muted small">Sem checklist. Com a esteira ligada, o cartão avança sozinho quando todos os itens forem concluídos.</p>`}
          ${checklists.map((cl) => html`<${ChecklistBlock} key=${cl.id} cl=${cl}
              onChange=${(n) => setChecklists(checklists.map((x) => (x.id === cl.id ? n : x)))}
              onDelete=${() => setChecklists(checklists.filter((x) => x.id !== cl.id))} />`)}
        </section>

        <section className="cm-sec">
          <h3><${Icon} n="link" /> Anexos e links</h3>
          <${Attachments} card=${card} onChange=${(list, act) => p({ attachments: list }, act)} />
        </section>

        <section className="cm-sec">
          <h3><${Icon} n="message" /> Comentários</h3>
          <div className="row" style=${{ alignItems: 'flex-start' }}>
            <${Avatar} person=${Data.people[Me.id]} size=${30} />
            <div className="grow" style=${{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              <textarea className="inp" rows="2" value=${comment} placeholder="Escreva um comentário…" aria-label="Novo comentário"
                onChange=${(e) => setComment(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) addComment(); }}></textarea>
              ${comment.trim() && html`<div><button className="btn btn-primary btn-sm" onClick=${addComment}>Enviar</button></div>`}
            </div>
          </div>
          ${[...(card.comments || [])].reverse().map((c) => html`<div key=${c.id} className="comment">
            <${Avatar} person=${Data.people[c.personId]} size=${30} />
            <div className="body">
              <p className="who">${personName(c.personId)}<span>${fmtWhen(c.at)}</span></p>
              <p className="txt">${c.content}</p>
            </div>
            ${c.personId === Me.id && html`<button className="btn btn-ghost btn-icon btn-xs" aria-label="Excluir comentário" title="Excluir comentário"
                onClick=${() => p({ comments: card.comments.filter((x) => x.id !== c.id) })}><${Icon} n="trash" s=${13} /></button>`}
          </div>`)}
        </section>

        ${(card.activities || []).length > 0 && html`<section className="cm-sec">
          <h3><${Icon} n="history" /> Histórico</h3>
          <ul className="hist">
            ${card.activities.map((a) => html`<li key=${a.id}><strong style=${{ color: 'var(--foreground)', fontWeight: 500 }}>${personName(a.personId)}</strong> ${a.action}, ${fmtWhen(a.at)}</li>`)}
          </ul>
        </section>`}
      </div>

      <aside>
        <div className="side-sec">
          <button className=${'btn btn-secondary btn-sm btn-block' + (panel === 'members' ? ' is-active' : '')} aria-expanded=${panel === 'members'}
            onClick=${() => togglePanel('members')}><${Icon} n="users" s=${14} /> Pessoas</button>
          ${panel === 'members' && html`<div className="inline-panel">
            ${members.map((m) => { const on = (card.memberIds || []).includes(m.id); return html`<button key=${m.id} className=${'menu-item' + (on ? ' on' : '')}
                onClick=${() => toggleMember(m.id)}><${Avatar} person=${m} size=${22} /><span className="trunc">${m.name}</span>
                ${on && html`<span className="trail"><${Icon} n="check" s=${14} /></span>`}</button>`; })}
          </div>`}
          <button className=${'btn btn-secondary btn-sm btn-block' + (panel === 'labels' ? ' is-active' : '')} aria-expanded=${panel === 'labels'}
            onClick=${() => togglePanel('labels')}><${Icon} n="tag" s=${14} /> Etiquetas</button>
          ${panel === 'labels' && html`<div className="inline-panel">
            ${boardLabels.map((l) => { const on = (card.labelIds || []).includes(l.id); return html`<button key=${l.id} className="menu-item" onClick=${() => toggleLabel(l.id)}>
                <span className="swatch" style=${{ ...lblStyle(l.color), width: 30, height: 16 }}></span><span className="trunc">${l.name || LABEL_NAMES[l.color]}</span>
                ${on && html`<span className="trail"><${Icon} n="check" s=${14} /></span>`}</button>`; })}
            <div className="lbl-new">
              <input className="inp inp-sm" value=${lblName} placeholder="Nova etiqueta" aria-label="Nome da nova etiqueta"
                onChange=${(e) => setLblName(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') createLabel(); }} />
              <button className="btn btn-secondary btn-sm" onClick=${createLabel} disabled=${!lblName.trim()}>Criar</button>
              <div className="color-row" role="group" aria-label="Cor da etiqueta">
                ${LABEL_COLORS.map((c) => html`<button key=${c} className=${'color-opt' + (lblColor === c ? ' on' : '')} style=${lblStyle(c)}
                    aria-label=${LABEL_NAMES[c]} title=${LABEL_NAMES[c]} onClick=${() => setLblColor(c)}></button>`)}
              </div>
            </div>
          </div>`}
        </div>

        <div className="side-sec">
          <p className="side-h"><${Icon} n="calendar" s=${14} /> Datas</p>
          <label className="field"><span className="hint">Início</span>
            <input type="date" className="inp inp-sm" value=${card.startDate || ''} onChange=${(e) => p({ startDate: e.target.value || null })} /></label>
          <label className="field"><span className="hint">Prazo</span>
            <input type="date" className="inp inp-sm" value=${card.dueDate || ''}
              onChange=${(e) => p({ dueDate: e.target.value || null }, e.target.value ? `definiu o prazo para ${fmtDayLong(e.target.value)}` : 'removeu o prazo')} /></label>
        </div>

        ${lists.length > 1 && html`<div className="side-sec">
          <p className="side-h"><${Icon} n="moveRight" s=${14} /> Mover</p>
          <div className="move-row">
            <button className="btn btn-secondary btn-sm" disabled=${!prevList} onClick=${() => prevList && moveTo(prevList)}
              title=${prevList ? `Voltar para ${prevList.title}` : 'Primeira lista'} aria-label="Voltar uma lista"><${Icon} n="arrowLeft" /></button>
            <button className="btn btn-primary btn-sm" disabled=${!nextList} onClick=${() => nextList && moveTo(nextList)}
              title=${nextList ? `Avançar para ${nextList.title}` : 'Última lista'} aria-label="Avançar uma lista"><${Icon} n="arrowRight" /></button>
          </div>
          <select className="inp inp-sm" value=${card.listId} aria-label="Mover para a lista"
            onChange=${(e) => { const t = lists.find((l) => l.id === e.target.value); if (t && t.id !== card.listId) moveTo(t); }}>
            ${lists.map((l) => html`<option key=${l.id} value=${l.id}>${l.title}</option>`)}
          </select>
          ${nextList && html`<p className="hint">Ao marcar como concluído, o cartão vai para “${nextList.title}”.</p>`}
        </div>`}

        ${lists.length > 1 && html`<div className="side-sec">
          <${PipelineEditor} lists=${lists} value=${card.pipelineListIds || []} auto=${card.pipelineAuto !== false} currentListId=${card.listId}
            onChange=${(next) => p({ pipelineListIds: next })} onAutoChange=${(v) => p({ pipelineAuto: v })}
            members=${members} owners=${card.pipelineOwners || []} onOwnersChange=${(next) => p({ pipelineOwners: next })} />
        </div>`}

        <button className="btn btn-ghost btn-danger btn-sm btn-block" onClick=${() => setConfirmDel(true)}><${Icon} n="trash" s=${14} /> Excluir cartão</button>
      </aside>
    </div>
    <${ConfirmDialog} open=${confirmDel} onClose=${() => setConfirmDel(false)} danger=${true} confirmLabel="Excluir cartão"
      title="Excluir este cartão?" body=${`“${card.title}” e tudo o que há nele serão excluídos. Isso não pode ser desfeito.`}
      onConfirm=${() => { remove('cards', card.id); onClose(); }} />
  <//>`;
}

function ScheduleFields({ sch, onSet, noneLabel = 'Não se repete' }) {
  const kind = !sch ? 'none' : sch.type === 'monthly' ? 'monthly' : ((sch.days || []).slice().sort().join() === '1,2,3,4,5' ? 'workdays' : 'weekly');
  function onKind(k) {
    const since = todayStr();
    if (k === 'none') onSet(null);
    else if (k === 'workdays') onSet({ type: 'weekly', days: [1, 2, 3, 4, 5], since });
    else if (k === 'weekly') onSet({ type: 'weekly', days: sch && sch.type === 'weekly' && kind !== 'workdays' ? sch.days : [5], since });
    else onSet({ type: 'monthly', day: sch && sch.type === 'monthly' ? sch.day : new Date().getDate(), since });
  }
  function toggleDay(d) {
    const days = sch.days || [];
    const next = days.includes(d) ? days.filter((x) => x !== d) : [...days, d];
    if (!next.length) { toast('Escolha pelo menos um dia.', 'error'); return; }
    onSet({ type: 'weekly', days: next, since: todayStr() });
  }
  return html`<${Fragment}>
    <select className="inp" value=${kind} aria-label="Repetição" onChange=${(e) => onKind(e.target.value)}>
      <option value="none">${noneLabel}</option>
      <option value="workdays">Todo dia útil (segunda a sexta)</option>
      <option value="weekly">Toda semana, nos dias escolhidos</option>
      <option value="monthly">Todo mês, num dia fixo</option>
    </select>
    ${kind === 'weekly' && html`<div className="wd-row" role="group" aria-label="Dias da semana">
      ${WD_ORDER.map((d) => html`<button key=${d} className=${'wd-btn' + ((sch.days || []).includes(d) ? ' on' : '')} aria-pressed=${(sch.days || []).includes(d)}
          title=${WD_FULL[d]} onClick=${() => toggleDay(d)}>${WD_SHORT[d]}</button>`)}
    </div>`}
    ${kind === 'monthly' && html`<label className="row" style=${{ fontSize: 13 }}>No dia
      <input type="number" className="inp" style=${{ width: 76 }} min="1" max="31" value=${sch.day} aria-label="Dia do mês"
        onChange=${(e) => { const v = Math.min(31, Math.max(1, parseInt(e.target.value, 10) || 1)); onSet({ type: 'monthly', day: v, since: todayStr() }); }} />
      de cada mês</label>`}
    ${kind === 'monthly' && sch.day > 28 && html`<p className="hint">Nos meses sem o dia ${sch.day}, vale o último dia do mês.</p>`}
  <//>`;
}

function ScheduleEditor({ card }) {
  const sch = card.schedule && card.schedule.type ? card.schedule : null;
  const st = sch ? schedStatus(card) : null;
  function setSchedule(next) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const doneFor = next && card.isCompleted && occursOn(next, today) ? todayStr() : null;
    patch('cards', card.id, {
      schedule: next, doneFor, prevDoneFor: null, prevLastDone: null, lastDoneDate: doneFor,
      isCompleted: next ? !!doneFor : !!card.isCompleted,
      activities: logged(card, next ? `definiu a repetição: ${schedLabel(next)}` : 'removeu a repetição'),
    });
  }
  const statusTxt = !st ? '' : st.k === 'due' ? 'Deve ser executada hoje.'
    : st.k === 'late' ? `Atrasada desde ${fmtWd(st.since)}${st.missed > 1 ? ` (${st.missed} execuções perdidas)` : ''}. Ao concluir, ela volta a ficar em dia.`
    : st.k === 'done' ? (st.doneFor > todayStr() ? `Concluída antes da data; vale para ${fmtWd(st.doneFor)}.` : `Feita hoje. Próxima: ${fmtWd(st.next)}.`)
    : `Próxima execução: ${fmtWd(st.next)}. Se concluir antes, vale para essa data.`;
  return html`<section className="cm-sec" style=${{ marginTop: 20 }}>
    <h3><${Icon} n="repeat" /> Repetição</h3>
    <div style=${{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <${ScheduleFields} sch=${sch} onSet=${setSchedule} />
      ${st && html`<p className=${'sched-status ' + st.k}>${schedLabel(sch)}. ${statusTxt}</p>`}
      ${sch ? html`<p className="hint">Se não for concluída na data, fica atrasada e aparece no aviso do quadro. Depois de concluída, desmarca sozinha na próxima data. O Desmarcar concluídas também a desmarca, desfazendo a conclusão.</p>`
        : html`<p className="hint">Marque a caixa para concluir. Com repetição, a tarefa passa a ter datas certas para ser executada.</p>`}
    </div>
  </section>`;
}

function ChecklistBlock({ cl, onChange, onDelete }) {
  const [text, setText] = useState('');
  const [name, setName] = useState(cl.title);
  const [confirm, setConfirm] = useState(false);
  useEffect(() => setName(cl.title), [cl.title]);
  const items = cl.items || [];
  const done = items.filter((i) => i.checked).length;
  const pct = items.length ? Math.round((done / items.length) * 100) : 0;
  const setItems = (its) => onChange({ ...cl, items: its });
  function add() {
    const v = text.trim(); if (!v) return;
    setItems([...items, { id: uid(), content: v, checked: false }]); setText('');
  }
  return html`<div className="cl">
    <div className="cl-head">
      <input className="cl-name" value=${name} aria-label="Nome do checklist" onChange=${(e) => setName(e.target.value)}
        onBlur=${() => { const v = name.trim(); if (v && v !== cl.title) onChange({ ...cl, title: v }); else setName(cl.title); }}
        onKeyDown=${(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
      <span className="muted small">${done}/${items.length}</span>
      <button className="btn btn-ghost btn-icon btn-xs" aria-label="Excluir checklist" title="Excluir checklist"
        onClick=${() => (items.length ? setConfirm(true) : onDelete())}><${Icon} n="trash" s=${14} /></button>
    </div>
    <div className=${'progress' + (pct === 100 ? ' full' : '')} role="progressbar" aria-valuenow=${pct} aria-valuemin="0" aria-valuemax="100" aria-label="Progresso do checklist">
      <span style=${{ width: pct + '%' }}></span></div>
    <ul className="cl-items">
      ${items.map((it) => html`<li key=${it.id} className="cl-item">
        <input type="checkbox" checked=${!!it.checked} aria-label=${it.content}
          onChange=${(e) => setItems(items.map((x) => (x.id === it.id ? { ...x, checked: e.target.checked } : x)))} />
        <span className=${'cl-text' + (it.checked ? ' done' : '')}>${it.content}</span>
        <button className="btn btn-ghost btn-icon btn-xs x" aria-label="Remover item" title="Remover item"
          onClick=${() => setItems(items.filter((x) => x.id !== it.id))}><${Icon} n="x" s=${13} /></button>
      </li>`)}
    </ul>
    <div className="row">
      <input className="inp inp-sm" value=${text} placeholder="Novo item" aria-label="Novo item do checklist"
        onChange=${(e) => setText(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } }} />
      <button className="btn btn-secondary btn-sm" onClick=${add} disabled=${!text.trim()}>Adicionar</button>
    </div>
    <${ConfirmDialog} open=${confirm} onClose=${() => setConfirm(false)} danger=${true} confirmLabel="Excluir checklist"
      title=${`Excluir “${cl.title}”?`} body=${`${plural(items.length, 'item será excluído', 'itens serão excluídos')}.`} onConfirm=${onDelete} />
  </div>`;
}

function Attachments({ card, onChange }) {
  const [name, setName] = useState('');
  const [url, setUrl] = useState('');
  const list = card.attachments || [];
  function add() {
    let u = url.trim(); if (!u) return;
    if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
    if (!/^(https?:|mailto:)/i.test(u)) { toast('Use um endereço que comece com https://', 'error'); return; }
    const n = name.trim() || u.replace(/^https?:\/\//i, '').slice(0, 60);
    onChange([...list, { id: uid(), name: n, url: u, personId: Me.id, at: now() }], `anexou “${n}”`);
    setName(''); setUrl('');
  }
  return html`<div>
    ${list.length === 0 && html`<p className="muted small">Cole links de documentos, planilhas ou pastas.</p>`}
    ${list.map((a) => html`<div key=${a.id} className="att">
      <${Icon} n="clip" s=${14} className="muted" />
      <a href=${a.url} target="_blank" rel="noopener noreferrer" title=${a.url}>${a.name}</a>
      <button className="btn btn-ghost btn-icon btn-xs" style=${{ marginLeft: 'auto' }} aria-label="Remover anexo" title="Remover anexo"
        onClick=${() => onChange(list.filter((x) => x.id !== a.id), `removeu o anexo “${a.name}”`)}><${Icon} n="trash" s=${13} /></button>
    </div>`)}
    <div className="att-form">
      <input className="inp inp-sm" value=${name} placeholder="Nome" aria-label="Nome do anexo" onChange=${(e) => setName(e.target.value)} />
      <input className="inp inp-sm" value=${url} placeholder="https://…" aria-label="Endereço do anexo" onChange=${(e) => setUrl(e.target.value)}
        onKeyDown=${(e) => { if (e.key === 'Enter') add(); }} />
      <button className="btn btn-secondary btn-sm" onClick=${add} disabled=${!url.trim()}><${Icon} n="plus" s=${14} /> Anexar</button>
    </div>
  </div>`;
}
</script>
<script>
/* ---------- Escolha de perfil ---------- */
function WhoAmI() {
  useData();
  const people = Object.values(Data.people).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'pt-BR'));
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  function create() {
    const n = name.trim(); if (!n) return;
    const id = uid();
    put('people', id, { name: n, email: email.trim() || null, createdAt: now() });
    setMe(id);
  }
  const onKey = (e) => { if (e.key === 'Enter') create(); };
  return html`<div className="center-page">
    <h1 className="hero-brand">Flowtify<span className="dot-accent">.</span></h1>
    <div className="hero-flow" aria-hidden="true"><span>A fazer</span><${Icon} n="arrowRight" s=${12} /><span>Em andamento</span><${Icon} n="arrowRight" s=${12} /><span>Concluído</span></div>
    <p className="muted">${people.length
      ? 'Quem está usando? Escolha seu nome para abrir seus quadros e cartões.'
      : 'Crie seu perfil para começar. Cada pessoa da equipe usa o próprio perfil, e é por ele que os cartões chegam até você.'}</p>
    ${people.length > 0 && html`<div className="who-list">
      ${people.map((p) => html`<button key=${p.id} className="who-btn" onClick=${() => setMe(p.id)}>
        <${Avatar} person=${p} size=${36} /><span><strong>${p.name}</strong>${p.email && html`<small>${p.email}</small>`}</span></button>`)}
    </div>`}
    <div className="who-form" style=${{ marginTop: people.length ? 0 : 22 }}>
      <h2>${people.length ? 'Não está na lista?' : 'Seu perfil'}</h2>
      <label className="field">Nome<input className="inp" value=${name} autoFocus=${!people.length} placeholder="Ex.: Guilherme" onChange=${(e) => setName(e.target.value)} onKeyDown=${onKey} /></label>
      <label className="field">E-mail (opcional)<input className="inp" type="email" value=${email} placeholder="nome@empresa.com" onChange=${(e) => setEmail(e.target.value)} onKeyDown=${onKey} /></label>
      <button className="btn btn-primary" onClick=${create} disabled=${!name.trim()}>Criar perfil e entrar</button>
    </div>
    <button className="btn btn-ghost btn-sm" style=${{ marginTop: 14 }} onClick=${() => window.dispatchEvent(new Event('flowtify:backup'))}>
      <${Icon} n="upload" s=${14} /> Trazer quadros de um backup</button>
  </div>`;
}

/* ---------- Meus quadros ---------- */
function Home({ go }) {
  useData();
  const wss = myWorkspaces();
  const [activeWs, setActiveWs] = useState(() => LS.get('flowtify:ws', null));
  const cur = wss.find((w) => w.id === activeWs) || wss[0] || null;
  const [newWsOpen, setNewWsOpen] = useState(false);
  const [newBoardOpen, setNewBoardOpen] = useState(false);
  const [shareWs, setShareWs] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [overId, setOverId] = useState(null);
  const select = (id) => { setActiveWs(id); LS.set('flowtify:ws', id); };

  if (!wss.length) {
    return html`<${FirstWorkspace} onCreate=${(n) => select(createWorkspace(n))} />`;
  }
  const boards = cur ? boardsOf(cur.id) : [];
  const isOwner = cur && cur.ownerId === Me.id;

  function dropOn(targetId) {
    if (!dragId || dragId === targetId) return;
    const arr = [...boards];
    const from = arr.findIndex((b) => b.id === dragId); const to = arr.findIndex((b) => b.id === targetId);
    if (from < 0 || to < 0) return;
    const [m] = arr.splice(from, 1); arr.splice(to, 0, m);
    arr.forEach((b, i) => { const pos = (i + 1) * 1000; if (b.position !== pos) patch('boards', b.id, { position: pos }); });
  }

  return html`<div className="home">
    <aside className="ws-side">
      <div className="ws-head">
        <h2>Espaços de trabalho</h2>
        <button className="btn btn-ghost btn-icon btn-xs" aria-label="Novo espaço" title="Novo espaço" onClick=${() => setNewWsOpen(true)}><${Icon} n="plus" s=${15} /></button>
      </div>
      <nav className="ws-list" aria-label="Espaços de trabalho">
        ${wss.map((ws) => html`<${WorkspaceItem} key=${ws.id} ws=${ws} isCurrent=${cur && ws.id === cur.id} onSelect=${() => select(ws.id)}
            onShare=${() => setShareWs(ws.id)}
            onDelete=${() => setConfirm({ title: `Excluir o espaço “${ws.name}”?`, body: `${plural(boardsOf(ws.id).length, 'quadro será excluído', 'quadros serão excluídos')} com todas as listas e cartões. Isso não pode ser desfeito.`, label: 'Excluir espaço', run: () => deleteWorkspace(ws.id) })} />`)}
      </nav>
      <button className="btn btn-ghost btn-sm" style=${{ marginTop: 12, color: 'var(--muted-foreground)' }} onClick=${() => window.dispatchEvent(new Event('flowtify:backup'))}>
        <${Icon} n="download" s=${14} /> Backup dos dados</button>
    </aside>

    <main className="boards-main">
      <div className="boards-top">
        <div>
          <h1>Quadros</h1>
          <p className="muted" style=${{ marginTop: 2 }}>${cur?.name}${cur && html`<span>, ${plural(membersOfWs(cur).length, 'pessoa', 'pessoas')}</span>`}</p>
        </div>
        ${cur && html`<button className="btn btn-outline" onClick=${() => setShareWs(cur.id)}><${Icon} n="userPlus" /> Convidar pessoas</button>`}
      </div>
      ${boards.length > 1 && html`<p className="hint" style=${{ marginTop: 14 }}>Arraste os quadros para mudar a ordem; o menu Quadros segue a mesma ordem.</p>`}
      <div className="grid">
        ${boards.map((b) => {
          const nLists = listsOf(b.id).length;
          const nCards = cardsOfBoard(b.id).length;
          return html`<div key=${b.id} className=${'tile' + (overId === b.id && dragId !== b.id ? ' over' : '') + (dragId === b.id ? ' dragging' : '')}
            role="link" tabIndex="0" style=${bgStyle(b.background)} draggable="true" aria-label=${'Abrir quadro ' + b.title}
            onClick=${() => go({ name: 'board', id: b.id })} onKeyDown=${(e) => { if (e.key === 'Enter') go({ name: 'board', id: b.id }); }}
            onDragStart=${(e) => { setDragId(b.id); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', b.id); } catch (err) { /* ignora */ } }}
            onDragOver=${(e) => { e.preventDefault(); if (overId !== b.id) setOverId(b.id); }}
            onDragLeave=${() => setOverId((o) => (o === b.id ? null : o))}
            onDrop=${(e) => { e.preventDefault(); dropOn(b.id); setOverId(null); setDragId(null); }}
            onDragEnd=${() => { setDragId(null); setOverId(null); }}>
            <h3>${b.title}</h3>
            <p>${plural(nLists, 'lista', 'listas')}, ${plural(nCards, 'cartão', 'cartões')}</p>
            <button className="btn btn-icon btn-xs tile-del" aria-label=${'Excluir quadro ' + b.title} title="Excluir quadro"
              onClick=${(e) => { e.stopPropagation(); setConfirm({ title: `Excluir o quadro “${b.title}”?`, body: `${plural(nCards, 'cartão será excluído', 'cartões serão excluídos')} junto com as listas. Isso não pode ser desfeito.`, label: 'Excluir quadro', run: () => deleteBoard(b.id) }); }}>
              <${Icon} n="trash" s=${14} /></button>
          </div>`;
        })}
        ${cur && html`<button className="tile-new" onClick=${() => setNewBoardOpen(true)}><${Icon} n="plus" /> Criar quadro</button>`}
      </div>
    </main>

    <${NameDialog} open=${newWsOpen} onClose=${() => setNewWsOpen(false)} title="Novo espaço de trabalho"
      sub="Um espaço agrupa os quadros de um time ou projeto." placeholder="Ex.: Comissionamento" cta="Criar espaço"
      onSave=${(n) => { select(createWorkspace(n)); toast('Espaço de trabalho criado', 'success'); }} />
    ${cur && html`<${NewBoardDialog} open=${newBoardOpen} onClose=${() => setNewBoardOpen(false)}
        onCreate=${(t, bg) => { const id = createBoard(cur.id, t, bg); toast('Quadro criado', 'success'); go({ name: 'board', id }); }} />`}
    ${shareWs && Data.workspaces[shareWs] && html`<${ShareDialog} ws=${Data.workspaces[shareWs]} onClose=${() => setShareWs(null)} />`}
    <${ConfirmDialog} open=${!!confirm} onClose=${() => setConfirm(null)} danger=${true} title=${confirm?.title || ''} body=${confirm?.body || ''}
      confirmLabel=${confirm?.label || 'Excluir'} onConfirm=${() => confirm && confirm.run()} />
  </div>`;
}

function WorkspaceItem({ ws, isCurrent, onSelect, onShare, onDelete }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(ws.name);
  const isOwner = ws.ownerId === Me.id;
  function commit() {
    setEditing(false);
    const v = draft.trim();
    if (v && v !== ws.name) patch('workspaces', ws.id, { name: v });
  }
  if (editing) {
    return html`<div className="ws-item">
      <input className="inp inp-sm" autoFocus=${true} value=${draft} aria-label="Nome do espaço" onChange=${(e) => setDraft(e.target.value)} onBlur=${commit}
        onKeyDown=${(e) => { if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') { setDraft(ws.name); setEditing(false); } }} />
    </div>`;
  }
  return html`<div className=${'ws-item' + (isCurrent ? ' cur' : '')}>
    <button className="ws-btn" onClick=${onSelect} aria-current=${isCurrent ? 'true' : undefined} title=${ws.name}>${ws.name}</button>
    <div className="ws-tools">
      <button className="btn btn-ghost btn-icon btn-xs" aria-label="Pessoas do espaço" title="Pessoas do espaço" onClick=${onShare}><${Icon} n="users" s=${13} /></button>
      ${isOwner && html`<button className="btn btn-ghost btn-icon btn-xs" aria-label="Renomear espaço" title="Renomear espaço" onClick=${() => { setDraft(ws.name); setEditing(true); }}><${Icon} n="pencil" s=${13} /></button>`}
      ${isOwner && html`<button className="btn btn-ghost btn-icon btn-xs" aria-label="Excluir espaço" title="Excluir espaço" onClick=${onDelete}><${Icon} n="trash" s=${13} /></button>`}
    </div>
  </div>`;
}

function FirstWorkspace({ onCreate }) {
  const [name, setName] = useState('');
  const others = Object.values(Data.workspaces).length > 0;
  const go = () => { const v = name.trim(); if (v) onCreate(v); };
  return html`<div className="page"><div className="empty-box">
    <h1>Crie seu primeiro espaço de trabalho</h1>
    <p className="muted">Um espaço agrupa os quadros de um time ou projeto. Depois você convida as pessoas que vão trabalhar nele.</p>
    <div className="row" style=${{ marginTop: 18 }}>
      <input className="inp" autoFocus=${true} value=${name} placeholder="Ex.: Comissionamento" aria-label="Nome do espaço"
        onChange=${(e) => setName(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') go(); }} />
      <button className="btn btn-primary" style=${{ height: 36 }} onClick=${go} disabled=${!name.trim()}>Criar espaço</button>
    </div>
    ${others && html`<p className="note-box" style=${{ marginTop: 16 }}>Já existem espaços de outras pessoas. Para entrar em um deles, peça para alguém de lá adicionar você em Convidar pessoas.</p>`}
  </div></div>`;
}

function NameDialog({ open, onClose, title, sub, placeholder, cta, onSave }) {
  const [v, setV] = useState('');
  useEffect(() => { if (open) setV(''); }, [open]);
  const save = () => { const t = v.trim(); if (!t) return; onSave(t); onClose(); };
  return html`<${Dialog} open=${open} onClose=${onClose} width=${440} label=${title}>
    <h2>${title}</h2>
    ${sub && html`<p className="sub">${sub}</p>`}
    <div className="dlg-body"><input className="inp" autoFocus=${true} value=${v} placeholder=${placeholder} aria-label=${title}
      onChange=${(e) => setV(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') save(); }} /></div>
    <div className="dlg-foot"><button className="btn btn-ghost" onClick=${onClose}>Cancelar</button>
      <button className="btn btn-primary" onClick=${save} disabled=${!v.trim()}>${cta}</button></div>
  <//>`;
}

function NewBoardDialog({ open, onClose, onCreate }) {
  const [title, setTitle] = useState('');
  const [bg, setBg] = useState('aurora');
  useEffect(() => { if (open) { setTitle(''); setBg('aurora'); } }, [open]);
  const create = () => { const t = title.trim(); if (!t) return; onCreate(t, bg); onClose(); };
  return html`<${Dialog} open=${open} onClose=${onClose} width=${460} label="Criar quadro">
    <h2>Criar quadro</h2>
    <p className="sub">O quadro começa com as listas A Fazer, Em Andamento e Concluído. Renomeie ou crie outras depois.</p>
    <div className="dlg-body">
      <div className="preview" style=${bgStyle(bg)}>${title || 'Nome do quadro'}</div>
      <label className="field">Nome<input className="inp" autoFocus=${true} value=${title} placeholder="Ex.: Demanda da Mel"
        onChange=${(e) => setTitle(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') create(); }} /></label>
      <div className="field">Fundo
        <div className="bg-pick" role="radiogroup" aria-label="Fundo do quadro">
          ${BACKGROUNDS.map((b) => html`<button key=${b.key} role="radio" aria-checked=${bg === b.key} aria-label=${b.label} title=${b.label}
              className=${'bg-opt' + (bg === b.key ? ' on' : '')} style=${bgStyle(b.key)} onClick=${() => setBg(b.key)}></button>`)}
        </div>
      </div>
    </div>
    <div className="dlg-foot"><button className="btn btn-ghost" onClick=${onClose}>Cancelar</button>
      <button className="btn btn-primary" onClick=${create} disabled=${!title.trim()}>Criar quadro</button></div>
  <//>`;
}

function ShareDialog({ ws, onClose }) {
  useData();
  const isOwner = ws.ownerId === Me.id;
  const members = membersOfWs(ws);
  const others = Object.values(Data.people).filter((p) => !(ws.memberIds || []).includes(p.id)).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  const [pick, setPick] = useState('');
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  function addMember(pid) {
    if (!pid || (ws.memberIds || []).includes(pid)) return;
    patch('workspaces', ws.id, { memberIds: [...(ws.memberIds || []), pid] });
    toast(`${personName(pid)} agora tem acesso a “${ws.name}”`, 'success');
  }
  function createAndAdd() {
    const n = name.trim(); if (!n) return;
    const e = email.trim().toLowerCase();
    const existing = e && Object.values(Data.people).find((p) => (p.email || '').toLowerCase() === e);
    if (existing) { addMember(existing.id); }
    else { const id = uid(); put('people', id, { name: n, email: e || null, createdAt: now() }); addMember(id); }
    setName(''); setEmail('');
  }
  return html`<${Dialog} open=${true} onClose=${onClose} width=${520} label="Convidar pessoas">
    <h2>Pessoas em “${ws.name}”</h2>
    <p className="sub">Quem está aqui vê todos os quadros deste espaço e pode ser responsável por cartões e etapas da esteira.</p>
    <div className="dlg-body">
      <div className="people-list">
        ${members.map((m) => html`<div key=${m.id} className="person-row">
          <${Avatar} person=${m} size=${30} />
          <div className="info"><strong>${m.name}${m.id === Me.id ? ' (você)' : ''}</strong>${m.email && html`<small>${m.email}</small>`}</div>
          ${m.id === ws.ownerId ? html`<span className="tag">Dono</span>`
            : (isOwner || m.id === Me.id) && html`<button className="btn btn-ghost btn-sm btn-danger" onClick=${() => {
                patch('workspaces', ws.id, { memberIds: ws.memberIds.filter((x) => x !== m.id) });
                if (m.id === Me.id) onClose();
              }}>${m.id === Me.id ? 'Sair' : 'Remover'}</button>`}
        </div>`)}
      </div>
      ${others.length > 0 && html`<div className="field">Adicionar alguém que já tem perfil
        <div className="row">
          <select className="inp" value=${pick} onChange=${(e) => setPick(e.target.value)} aria-label="Pessoa">
            <option value="">Escolha uma pessoa…</option>
            ${others.map((p) => html`<option key=${p.id} value=${p.id}>${p.name}${p.email ? ` (${p.email})` : ''}</option>`)}
          </select>
          <button className="btn btn-primary" style=${{ height: 36 }} disabled=${!pick} onClick=${() => { addMember(pick); setPick(''); }}>Adicionar</button>
        </div></div>`}
      <div className="field">Criar perfil para uma pessoa nova
        <div className="row" style=${{ flexWrap: 'wrap' }}>
          <input className="inp grow" style=${{ flexBasis: 140 }} value=${name} placeholder="Nome" aria-label="Nome" onChange=${(e) => setName(e.target.value)} />
          <input className="inp grow" style=${{ flexBasis: 180 }} type="email" value=${email} placeholder="E-mail (opcional)" aria-label="E-mail"
            onChange=${(e) => setEmail(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') createAndAdd(); }} />
          <button className="btn btn-primary" style=${{ height: 36 }} disabled=${!name.trim()} onClick=${createAndAdd}>Adicionar</button>
        </div></div>
      <p className="note-box">Para a pessoa abrir o app, envie a ela o link deste artifact pelo botão Compartilhar do Claude. Ao abrir, ela escolhe o próprio nome na lista.</p>
    </div>
  <//>`;
}

/* ---------- Meus cartões ---------- */
function MyCards({ go }) {
  useData();
  const wsIds = new Set(myWorkspaces().map((w) => w.id));
  const rows = Object.values(Data.cards)
    .filter((c) => (c.memberIds || []).includes(Me.id))
    .map((c) => ({ c, list: Data.lists[c.listId], board: Data.boards[c.boardId] }))
    .filter((r) => r.board && r.list && wsIds.has(r.board.workspaceId))
    .sort((a, b) => (a.c.dueDate || '9999').localeCompare(b.c.dueDate || '9999'));
  const open = rows.filter((r) => !r.c.isCompleted);
  const done = rows.filter((r) => r.c.isCompleted);
  const item = (r) => {
    const st = dueState(r.c.dueDate, r.c.isCompleted);
    return html`<button key=${r.c.id} className="mc-item" onClick=${() => go({ name: 'board', id: r.board.id, card: r.c.id })}>
      <span className="swatch" style=${bgStyle(r.board.background)}></span>
      <span className="grow">
        <span className=${'t' + (r.c.isCompleted ? ' done' : '')} style=${{ display: 'block' }}>${r.c.title}</span>
        <span className="w" style=${{ display: 'block' }}>${r.board.title}, lista “${r.list.title}”</span>
        ${r.c.dueDate && html`<span className=${'due due-' + st}><${Icon} n="calendar" s=${11} /> ${fmtDayLong(r.c.dueDate)}</span>`}
      </span>
    </button>`;
  };
  return html`<div className="page">
    <h1>Meus cartões</h1>
    <p className="muted" style=${{ marginTop: 4 }}>Tudo que está com você em todos os quadros compartilhados. Quando a esteira passa um cartão para você, ele aparece aqui.</p>
    ${rows.length === 0 && html`<div className="empty-box" style=${{ margin: '24px 0' }}><p className="muted">Nenhum cartão atribuído a você por enquanto. Abra um cartão e use Pessoas para se colocar como responsável.</p></div>`}
    ${open.length > 0 && html`<h2>Em aberto (${open.length})</h2><div className="mc-list">${open.map(item)}</div>`}
    ${done.length > 0 && html`<h2>Concluídos (${done.length})</h2><div className="mc-list">${done.map(item)}</div>`}
  </div>`;
}

/* ---------- Busca global ---------- */
function SearchDialog({ open, onClose, go }) {
  useData();
  const [term, setTerm] = useState('');
  const [sel, setSel] = useState(0);
  useEffect(() => { if (open) { setTerm(''); setSel(0); } }, [open]);
  if (!open) return null;
  const t = term.trim().toLowerCase();
  const ws = new Set(myWorkspaces().map((w) => w.id));
  const boards = t.length > 1 ? Object.values(Data.boards).filter((b) => ws.has(b.workspaceId) && b.title.toLowerCase().includes(t)).slice(0, 8) : [];
  const cards = t.length > 1 ? Object.values(Data.cards).filter((c) => { const b = Data.boards[c.boardId]; return b && Data.lists[c.listId] && ws.has(b.workspaceId) && c.title.toLowerCase().includes(t); }).slice(0, 12) : [];
  const results = [...boards.map((b) => ({ k: 'b', b })), ...cards.map((c) => ({ k: 'c', c }))];
  const pick = (r) => { onClose(); if (r.k === 'b') go({ name: 'board', id: r.b.id }); else go({ name: 'board', id: r.c.boardId, card: r.c.id }); };
  let i = -1;
  return html`<${Dialog} open=${true} onClose=${onClose} width=${560} label="Buscar">
    <h2 className="sr-only">Buscar quadros e cartões</h2>
    <input className="inp search-inp" autoFocus=${true} value=${term} placeholder="Buscar quadros e cartões…" aria-label="Buscar quadros e cartões"
      style=${{ marginRight: 36, width: 'calc(100% - 36px)' }}
      onChange=${(e) => { setTerm(e.target.value); setSel(0); }}
      onKeyDown=${(e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); setSel((s) => Math.min(results.length - 1, s + 1)); }
        if (e.key === 'ArrowUp') { e.preventDefault(); setSel((s) => Math.max(0, s - 1)); }
        if (e.key === 'Enter' && results[sel]) pick(results[sel]);
      }} />
    ${t.length < 2 && html`<p className="muted small" style=${{ marginTop: 12 }}>Digite ao menos duas letras.</p>`}
    ${t.length > 1 && results.length === 0 && html`<p className="muted small" style=${{ marginTop: 12 }}>Nada encontrado para “${term.trim()}”.</p>`}
    ${boards.length > 0 && html`<p className="res-h">Quadros</p>`}
    ${boards.map((b) => { i++; const me = i; return html`<button key=${'b' + b.id} className=${'res' + (sel === me ? ' sel' : '')} onClick=${() => pick({ k: 'b', b })}>
        <span className="swatch" style=${bgStyle(b.background)}></span><span className="trunc">${b.title}</span><small>${Data.workspaces[b.workspaceId]?.name}</small></button>`; })}
    ${cards.length > 0 && html`<p className="res-h">Cartões</p>`}
    ${cards.map((c) => { i++; const me = i; return html`<button key=${'c' + c.id} className=${'res' + (sel === me ? ' sel' : '')} onClick=${() => pick({ k: 'c', c })}>
        <${Icon} n=${c.isTask ? 'checkSquare' : 'sticky'} s=${14} className="muted" /><span className=${'trunc' + (c.isCompleted ? ' done' : '')}>${c.title}</span>
        <small>${Data.boards[c.boardId]?.title}, ${Data.lists[c.listId]?.title}</small></button>`; })}
  <//>`;
}

/* ---------- Cabeçalho ---------- */

/* ---------- Backup: exportar e importar ---------- */
function buildBackup() {
  const data = {};
  for (const c of SHARED) data[c] = Object.values(Data[c]);
  return {
    app: 'flowtify', version: 1, exportedAt: now(), exportedBy: personName(Me.id),
    origin: location.protocol === 'file:' ? 'arquivo local' : location.host, data, notes: Object.values(Data.notes),
  };
}
async function downloadBackup() {
  const json = JSON.stringify(buildBackup(), null, 1);
  const filename = `flowtify-backup-${todayStr()}.json`;
  let dl = null;
  if (window.claude && typeof window.claude.use === 'function') { try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; } }
  if (dl) {
    try { await dl.save({ filename, data: json }); toast('Backup salvo.', 'success'); }
    catch (e) { if (e && e.code !== 'declined') toast('Não foi possível salvar o backup aqui. Tente pelo arquivo local ou pelo GitHub.', 'error'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('Backup baixado: ' + filename, 'success');
}
function parseBackup(text) {
  let o; try { o = JSON.parse(text); } catch (e) { throw new Error('O arquivo não é um backup válido (não é JSON).'); }
  if (!o || o.app !== 'flowtify' || !o.data || typeof o.data !== 'object') throw new Error('Este arquivo não é um backup do Flowtify.');
  const out = { data: {}, notes: [], exportedAt: o.exportedAt || null, exportedBy: o.exportedBy || null, origin: o.origin || null };
  const ok = (d) => d && typeof d === 'object' && typeof d.id === 'string' && d.id.length > 0 && d.id.length < 80;
  for (const c of SHARED) out.data[c] = Array.isArray(o.data[c]) ? o.data[c].filter(ok) : [];
  out.notes = Array.isArray(o.notes) ? o.notes.filter(ok) : [];
  return out;
}
function putMany(col, docs) {
  if (!docs.length) return;
  const m = { ...Data[col] };
  for (const d of docs) { const c = clean(d); m[d.id] = { ...c, id: d.id }; }
  Data[col] = m; emit();
  for (const d of docs) write(col, d.id, { t: 'set', d: clean(d) });
}
function applyBackup(b, mode) {
  const cols = [...SHARED, 'notes'];
  const src = (c) => (c === 'notes' ? b.notes : b.data[c]);
  let added = 0;
  for (const c of cols) {
    const docs = src(c);
    if (mode === 'replace') {
      const keep = new Set(docs.map((d) => d.id));
      removeMany(c, Object.keys(Data[c]).filter((id) => !keep.has(id)));
      putMany(c, docs); added += docs.length;
    } else {
      const fresh = docs.filter((d) => !Data[c][d.id]);
      putMany(c, fresh); added += fresh.length;
    }
  }
  return added;
}

function BackupDialog({ open, onClose }) {
  useData();
  const [parsed, setParsed] = useState(null);
  const [err, setErr] = useState('');
  const inputRef = useRef(null);
  useEffect(() => { if (open) { setParsed(null); setErr(''); } }, [open]);
  if (!open) return null;
  const count = (o) => ({ ws: o.workspaces.length, boards: o.boards.length, lists: o.lists.length, cards: o.cards.length, people: o.people.length });
  const cur = count(Object.fromEntries(SHARED.map((c) => [c, Object.values(Data[c])])));
  function onFile(e) {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    setErr(''); setParsed(null);
    const r = new FileReader();
    r.onload = () => { try { setParsed(parseBackup(String(r.result || ''))); } catch (x) { setErr(x.message); } };
    r.onerror = () => setErr('Não foi possível ler o arquivo.');
    r.readAsText(f);
  }
  function run(mode) {
    const n = applyBackup(parsed, mode);
    toast(mode === 'replace' ? 'Dados substituídos pelo backup.' : (n ? `${n} itens novos importados.` : 'Nada novo: tudo do backup já estava aqui.'), 'success');
    onClose();
  }
  const pc = parsed && count(parsed.data);
  const summary = (c) => `${plural(c.boards, 'quadro', 'quadros')}, ${plural(c.lists, 'lista', 'listas')}, ${plural(c.cards, 'cartão', 'cartões')} e ${plural(c.people, 'pessoa', 'pessoas')}`;
  return html`<${Dialog} open=${true} onClose=${onClose} width=${520} label="Backup dos dados">
    <h2>Backup dos dados</h2>
    <p className="sub">Os dados ficam salvos neste navegador${Backend.mode === 'db' ? ' (aqui, no banco deste link)' : ''}. Com o backup você guarda uma cópia, leva os quadros para outro endereço ou computador e restaura se algo for apagado.</p>
    <div className="dlg-body">
      <section className="note-box" style=${{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        <strong style=${{ color: 'var(--foreground)' }}>Exportar</strong>
        <span>Baixa um arquivo .json com ${summary(cur)}, incluindo históricos, comentários e post-its.</span>
        <div><button className="btn btn-primary btn-sm" onClick=${downloadBackup}><${Icon} n="download" s=${14} /> Exportar backup</button></div>
      </section>
      <section className="note-box" style=${{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        <strong style=${{ color: 'var(--foreground)' }}>Importar</strong>
        <span>Escolha um arquivo de backup do Flowtify.</span>
        <input ref=${inputRef} type="file" accept=".json,application/json" className="sr-only" onChange=${onFile} aria-label="Arquivo de backup" />
        <div><button className="btn btn-secondary btn-sm" onClick=${() => inputRef.current && inputRef.current.click()}><${Icon} n="upload" s=${14} /> Escolher arquivo</button></div>
        ${err && html`<span style=${{ color: 'var(--destructive)' }}>${err}</span>`}
        ${parsed && html`<${Fragment}>
          <span style=${{ color: 'var(--foreground)' }}>O backup tem ${summary(pc)}${parsed.exportedAt ? `, exportado em ${fmtWhen(parsed.exportedAt)}` : ''}${parsed.exportedBy ? ` por ${parsed.exportedBy}` : ''}.</span>
          <div className="row" style=${{ flexWrap: 'wrap' }}>
            <button className="btn btn-primary btn-sm" onClick=${() => run('merge')}>Juntar com os dados atuais</button>
            <button className="btn btn-destructive btn-sm" onClick=${() => run('replace')}>Substituir tudo</button>
          </div>
          <span className="hint">Juntar só acrescenta o que ainda não existe aqui e não altera nada do que já está. Substituir apaga os dados atuais e deixa só os do backup.</span>
        <//>`}
      </section>
    </div>
  <//>`;
}

function Header({ route, go, openSearch, theme, toggleTheme }) {
  useData();
  const me = Data.people[Me.id];
  return html`<header className="hdr">
    <button className="brand" onClick=${() => go({ name: 'home' })} aria-label="Flowtify, ir para Meus quadros">Flowtify<span>.</span></button>
    <${BoardSwitcher} go=${go} />
    <button className=${'btn btn-ghost' + (route.name === 'mine' ? ' is-active' : '')} onClick=${() => go({ name: 'mine' })} aria-label="Meus cartões">
      <${Icon} n="userCheck" /><span className="hide-sm">Meus cartões</span></button>
    <button className="btn btn-outline search-trigger hide-sm" onClick=${openSearch} aria-label="Buscar quadros e cartões">
      <${Icon} n="search" /><span className="lbl">Buscar quadros e cartões</span><kbd>Ctrl K</kbd></button>
    <div className="hdr-right">
      <button className="btn btn-ghost btn-icon show-sm" aria-label="Buscar" onClick=${openSearch}><${Icon} n="search" /></button>

        <${Icon} n=${theme === 'dark' ? 'sun' : 'moon'} /></button>
      <${Popover} align="end" width=${230} trigger=${({ toggle }) => html`<button className="btn btn-ghost btn-icon av-btn" aria-label=${'Perfil de ' + (me?.name || '')} onClick=${toggle}>
          <${Avatar} person=${me} size=${30} /></button>`}>
        ${({ close }) => html`<div className="menu-label" style=${{ color: 'var(--foreground)', fontSize: 13 }}>${me?.name}</div>
          ${me?.email && html`<div className="menu-sub">${me.email}</div>`}
          <div className="sep"></div>
          <button className="menu-item" onClick=${() => { close(); window.dispatchEvent(new Event('flowtify:backup')); }}><${Icon} n="download" /> Backup dos dados</button>
          <button className="menu-item" onClick=${() => { close(); setMe(null); }}><${Icon} n="logOut" /> Trocar de pessoa</button>`}
      <//>
    </div>
  </header>`;
}

/* ---------- App ---------- */
function getTheme() {
  const t = LS.get('flowtify:theme', null);
  if (t === 'light' || t === 'dark') return t;
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'light'; }
}
function initialRoute() {
  const h = (location.hash || '').replace('#', '');
  if (h === 'meus-cartoes') return { name: 'mine' };
  const r = LS.get('flowtify:route', null);
  if (r && r.name === 'board' && r.id) return { name: 'board', id: r.id };
  if (r && r.name === 'mine') return { name: 'mine' };
  return { name: 'home' };
}
function App() {
  useData();
  const [route, setRoute] = useState(initialRoute);
  const [searchOpen, setSearchOpen] = useState(false);
  const [backupOpen, setBackupOpen] = useState(false);
  useEffect(() => { const h = () => setBackupOpen(true); window.addEventListener('flowtify:backup', h); return () => window.removeEventListener('flowtify:backup', h); }, []);
  const [theme, setTheme] = useState(getTheme);
  const [timedOut, setTimedOut] = useState(false);
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  useEffect(() => { const t = setTimeout(() => setTimedOut(true), 12000); return () => clearTimeout(t); }, []);
  useEffect(() => {
    const k = (e) => { if ((e.metaKey || e.ctrlKey) && (e.key || '').toLowerCase() === 'k') { e.preventDefault(); setSearchOpen((o) => !o); } };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, []);
  const go = (r) => { setRoute(r); LS.set('flowtify:route', { name: r.name, id: r.id || null }); };
  const toggleTheme = () => setTheme((t) => { const n = t === 'dark' ? 'light' : 'dark'; LS.set('flowtify:theme', n); return n; });

  const ready = Backend.mode !== 'loading' && (SHARED.every((c) => Backend.ready.has(c)) || timedOut);
  const banner = Backend.mode === 'local' && html`<div className="banner">Modo local: as alterações ficam salvas só neste navegador.</div>`;
  if (!ready) return html`<div className="loading"><p className="hero-brand" style=${{ fontSize: 28, fontFamily: 'Space Grotesk, sans-serif' }}>Flowtify<span className="dot-accent">.</span></p><p className="muted">Carregando quadros…</p></div>`;
  const me = Me.id && Data.people[Me.id];
  if (!me) return html`<div className="app">${banner}<main className="main"><${WhoAmI} /></main>
    <${BackupDialog} open=${backupOpen} onClose=${() => setBackupOpen(false)} /><${ToastHost} /></div>`;

  let page;
  if (route.name === 'board') page = html`<${BoardPage} key=${route.id} id=${route.id} cardId=${route.card} go=${go} />`;
  else if (route.name === 'mine') page = html`<${MyCards} go=${go} />`;
  else page = html`<${Home} go=${go} />`;
  return html`<div className="app">
    <${Header} route=${route} go=${go} openSearch=${() => setSearchOpen(true)} theme=${theme} toggleTheme=${toggleTheme} />
    ${banner}
    <main className=${'main' + (route.name === 'board' ? ' main-board' : '')}>${page}</main>
    <${SearchDialog} open=${searchOpen} onClose=${() => setSearchOpen(false)} go=${go} />
    <${BackupDialog} open=${backupOpen} onClose=${() => setBackupOpen(false)} />
    <${ToastHost} />
  </div>`;
}

document.documentElement.setAttribute('data-theme', getTheme());
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
initBackend();
</script>
